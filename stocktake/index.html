<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>재고조사 — 마켓인유</title>
<meta name="theme-color" content="#faf9f5">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="/miu-hub/shared/tokens.css?v=202611110529">
<link rel="stylesheet" href="/miu-hub/shared/layout.css?v=202611110529">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
<style>
body { font-family: var(--miu-sans); background: var(--miu-canvas); color: var(--miu-ink); word-break: keep-all; }
.wrap { max-width: 560px; margin: 0 auto; padding: 8px 20px 48px; }
.card { background: var(--miu-surface-card); border-radius: var(--miu-r-lg); padding: 18px; margin-top: 16px; }
.card h2 { font-family: var(--miu-serif); font-size: 20px; font-weight: 500; letter-spacing: -0.5px; }
.card .meta { font-size: 13px; color: var(--miu-muted); margin-top: 4px; line-height: 1.6; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 14px; padding: 15px 16px; border-radius: var(--miu-r-lg); border: 1px solid var(--miu-hairline); background: var(--miu-canvas); color: var(--miu-ink); font-family: inherit; font-size: 15px; font-weight: 700; text-decoration: none; cursor: pointer; }
.btn:active { background: var(--miu-surface-strong); }
.btn.primary { background: var(--miu-primary); color: #fff; border-color: transparent; }
.btn.primary:active { background: var(--miu-primary-active); }
.loc { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--miu-hairline-soft); font-size: 14px; }
.loc:last-child { border-bottom: none; }
.loc .s { font-size: 12.5px; color: var(--miu-muted); margin-top: 1px; }
.bar { height: 5px; background: var(--miu-surface-strong); border-radius: 3px; margin-top: 5px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--miu-primary); }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 16px; padding: 14px 16px; border-radius: var(--miu-r-lg); background: color-mix(in srgb, var(--miu-warning) 20%, var(--miu-canvas)); color: #5a4408; font-weight: 700; font-size: 14px; text-decoration: none; }
.empty { text-align: center; padding: 56px 24px; color: var(--miu-muted); font-size: 14px; line-height: 1.7; }
.empty strong { display: block; color: var(--miu-ink); font-size: 16px; margin-bottom: 4px; }
.guide { margin-top: 24px; font-size: 13px; color: var(--miu-muted); line-height: 1.75; }
.guide summary { cursor: pointer; font-weight: 700; color: var(--miu-body); }
.guide ol { padding-left: 18px; margin-top: 6px; }
.guide a { display: inline-block; margin-top: 8px; font-weight: 600; color: var(--miu-primary); text-decoration: none; }
.err { margin-top: 16px; padding: 12px 14px; border-radius: var(--miu-r-md); background: color-mix(in srgb, var(--miu-error) 12%, transparent); color: #7a2a2a; font-size: 13px; }
</style>
<script src="/miu-hub/shared/config.js?v=202611110529"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/miu-hub/shared/supabase-client.js?v=202611110529"></script>
<script src="/miu-hub/shared/auth-guard.js?v=202611110529"></script>
</head>
<body>

<header class="miu-header">
  <a href="/miu-hub/" class="miu-header-back" aria-label="허브로"><i class="ph-bold ph-caret-left"></i></a>
  <div class="miu-header-title">
    <div class="miu-header-eyebrow">STOCKTAKE</div>
    <h1 class="miu-header-h1">재고조사</h1>
  </div>
</header>

<div class="wrap" id="root"><div class="empty">불러오는 중…</div></div>

<script src="js/common.js?v=202611110529"></script>
<script>
(async () => {
  const { esc, fmt } = ST;
  const root = document.getElementById('root');
  const stateChip = (s) => s === 'done' ? '<span class="miu-chip success">마감</span>' : s === 'skipped' ? '<span class="miu-chip muted">건너뜀</span>' : '<span class="miu-chip primary">조사 중</span>';

  try {
    const me = await ST.whoami();
    const sess = await ST.activeSession();

    // 관리자: 지난 조사에 미처리 결과가 남았는지
    let pending = null;
    if (me.isAdmin) {
      const { data: closed, error } = await window.sb.from('stocktake_sessions').select('id,session_date').eq('status', 'closed').order('started_at', { ascending: false }).limit(6);
      if (error) throw new Error(error.message);
      for (const s of closed || []) {
        const { count, error: e2 } = await window.sb.from('stocktake_results').select('barcode', { count: 'exact', head: true }).eq('session_id', s.id).eq('resolution', 'open');
        if (e2) throw new Error(e2.message);
        if (count) { pending = { id: s.id, date: s.session_date, count }; break; }
      }
    }
    const pendingBanner = pending
      ? `<a class="banner" href="results.html?session=${esc(pending.id)}"><span>${esc(ST.md(pending.date))} 조사 미처리 ${esc(fmt(pending.count))}건</span><i class="ph-bold ph-caret-right"></i></a>` : '';

    let main;
    if (sess) {
      const rows = await ST.rpc('stocktake_progress', { p_session: sess.id });
      const doneN = rows.filter((r) => r.state !== 'open').length;
      main = `<div class="card">
          <h2>${esc(ST.md(sess.session_date))} 재고조사 진행 중</h2>
          <div class="meta">${esc(sess.started_by || '')}님이 시작했어요${sess.note ? ' · ' + esc(sess.note) : ''}<br>위치 ${esc(fmt(doneN))} / ${esc(fmt(rows.length))}곳 마감</div>
          <a class="btn primary" href="scan.html"><i class="ph-bold ph-barcode"></i>스캔하러 가기</a>
          ${me.isAdmin ? '<a class="btn" href="admin.html"><i class="ph-bold ph-gauge"></i>진행 현황 · 마감 관리</a>' : ''}
        </div>
        <div class="card" style="margin-top:12px">
          ${rows.map((r) => {
            const pct = r.expected_count ? Math.min(100, Math.round((r.scanned / r.expected_count) * 100)) : 0;
            return `<div class="loc"><div style="flex:1;min-width:0"><div>${esc(r.location)}</div><div class="s">스캔 ${esc(fmt(r.scanned))} / 장부 ${esc(fmt(r.expected_count))}</div><div class="bar"><i style="width:${pct}%"></i></div></div>${stateChip(r.state)}</div>`;
          }).join('')}
        </div>`;
    } else if (me.isAdmin) {
      main = `<div class="card">
          <h2>진행 중인 재고조사가 없어요</h2>
          <div class="meta">한 달에 한 번 정도, 시작할 때 장부가 고정되고 직원들이 각자 폰으로 스캔해요.</div>
          <a class="btn primary" href="admin.html"><i class="ph-bold ph-clipboard-text"></i>새 재고조사 시작</a>
          <a class="btn" href="results.html"><i class="ph-bold ph-list-checks"></i>지난 결과 · 후속 처리</a>
        </div>`;
    } else {
      main = `<div class="empty"><strong>진행 중인 재고조사가 없어요</strong>관리자가 재고조사를 시작하면 여기서 스캔할 수 있어요.</div>`;
    }

    root.innerHTML = pendingBanner + main + `
      <details class="guide"><summary>사용 방법</summary><ol>
        <li>"스캔하러 가기"에서 조사할 위치를 고릅니다. 같은 위치를 여러 명이 나눠 스캔해도 돼요.</li>
        <li>바코드를 스캔하면 바로 소리와 색으로 알려줘요. 다른 위치 장부이거나 장부에 없는 물건은 경고가 뜨지만 그대로 기록돼요.</li>
        <li>스캔은 자동으로 서버에 저장돼요. 인터넷이 끊겨도 기기에 남았다가 연결되면 전송돼요. 따로 제출하지 않아도 돼요.</li>
        <li>다 끝나면 "남은 물건"으로 못 찾은 물건을 확인하고 "위치 마감"을 누르세요.</li>
      </ol><a href="/miu-hub/office/index.html#75656a1d-7187-4816-80c8-30dacb88dfdc"><i class="ph-bold ph-file-pdf"></i> 전체 가이드(PDF) 보기 · 받기</a></details>`;
  } catch (e) {
    root.innerHTML = `<div class="err">${esc(e.message || '불러오지 못했어요.')}</div>`;
  }
})();
</script>
</body>
</html>
