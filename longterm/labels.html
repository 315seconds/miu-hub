<script>
function escapeHtml(s) {
  return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function appAlert(msg) {
  return new Promise(resolve => {
    const o = document.createElement('div');
    o.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box';
    o.innerHTML = `<div style="background:var(--miu-surface-card);border:1px solid var(--miu-hairline);border-radius:14px;padding:24px 20px;max-width:320px;width:100%"><div style="color:var(--miu-ink);font-size:15px;line-height:1.6;white-space:pre-line;margin-bottom:20px">${escapeHtml(msg)}</div><button id="_ok" class="miu-btn miu-btn-primary" style="width:100%">확인</button></div>`;
    document.body.appendChild(o);
    const close = () => { o.remove(); resolve(); };
    o.querySelector('#_ok').onclick = close;
    o.onclick = e => { if (e.target===o) close(); };
  });
}
</script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--miu-canvas); color: var(--miu-ink); font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
.screen-header h1 { font-size: 18px; white-space: normal; }
.screen-header .sub { font-size: 13px; color: var(--miu-muted); margin-top: 2px; }
.screen-controls { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; background: var(--miu-surface-soft); border-bottom: 1px solid var(--miu-hairline); }
.btn-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.team-btn {
  background: var(--miu-surface-card); color: var(--miu-body); border: 1px solid var(--miu-field-border);
  border-radius: 8px; padding: 8px 14px; min-height: 44px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: inherit;
}
.team-btn.active { background: var(--miu-primary); border-color: var(--miu-primary); color: #fff; }
.zpl-btn {
  background: var(--miu-canvas); color: var(--miu-ink); border: 1px solid var(--miu-field-border);
  border-radius: 8px; padding: 8px 14px; min-height: 44px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: inherit;
}
.zpl-btn:disabled { opacity: .45; cursor: not-allowed; }
.print-btn {
  background: var(--miu-primary); color: #fff; border: none; border-radius: 8px;
  padding: 8px 16px; min-height: 48px; font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: inherit;
  flex: 1 1 100%;
}
.print-btn:disabled { opacity: 1; background: var(--miu-primary-disabled); color: var(--miu-muted); cursor: not-allowed; }
@media (min-width: 601px) { .print-btn { flex: 0 0 auto; } }
.not-found-box {
  display: none; background: #fbeceb; color: var(--miu-error-text);
  border: 1px solid var(--miu-error); border-radius: 8px; padding: 12px 16px; margin: 12px 16px 0;
}
.label-grid { display: flex; flex-wrap: wrap; gap: 12px; padding: 20px; justify-content: flex-start; }
.label-separator {
  width: 4cm; height: 3cm;
  background: var(--miu-ink); border: 2px solid var(--miu-body); border-radius: 2px;
  display: flex; align-items: center; justify-content: center; text-align: center; padding: 4px;
}
.label-separator .sep-num { font-size: 13pt; font-weight: 900; color: var(--miu-canvas); line-height: 1.3; }
@media screen {
  .label-separator { transform: scale(1.9); transform-origin: top left; margin-right: calc(4cm * .9); margin-bottom: calc(3cm * .9); }
}
.daily-controls { display: none; align-items: center; gap: 8px; flex-wrap: wrap; }
.daily-controls input[type="date"], .daily-controls select {
  background: var(--miu-surface-card); color: var(--miu-ink); border: 1px solid var(--miu-field-border);
  border-radius: 8px; padding: 8px 10px; min-height: 44px; font-size: 16px; font-family: inherit;
}
.daily-toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--miu-body); white-space: nowrap; min-height: 40px; }
.label {
  width: 4cm; height: 3cm; background: #fff; border: 1px solid #bbb;
  border-radius: 2px; padding: 2.5px 4px 2px 4px;
  display: flex; flex-direction: column; overflow: hidden;
}
@media screen {
  .label-grid { gap: 16px; padding: 24px; }
  .label { transform: scale(1.9); transform-origin: top left; margin-right: calc(4cm * .9); margin-bottom: calc(3cm * .9); }
}
.label-name { font-size: 6.5pt; font-weight: 700; color: #111; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; flex-shrink: 0; padding-top: 1.5px; }
.label-price-wrap { flex: 1; display: flex; align-items: center; justify-content: center; }
.label-price { font-size: 20pt; font-weight: 900; color: #000; text-align: center; line-height: 1.05; letter-spacing: -.5px; }
.label-bottom { flex-shrink: 0; height: 1.35cm; display: flex; flex-direction: column; }
.label-barcode { flex: 1; display: flex; align-items: center; overflow: hidden; min-height: 0; }
.label-barcode svg { width: 100%; height: 100%; display: block; }
.label-barcode-num { font-size: 7pt; font-weight: 900; color: #000; text-align: center; font-family: 'Courier New', monospace; letter-spacing: 1px; flex-shrink: 0; line-height: 1.2; padding-bottom: 2px; }
</style>

<body>
<header class="screen-header miu-header">
  <a href="index.html" class="miu-header-back" aria-label="뒤로"><i class="ph-bold ph-caret-left"></i></a>
  <div class="miu-header-title">
    <h1 id="header-title" class="miu-header-h1">라벨 로드 중…</h1>
    <div class="sub" id="header-sub"></div>
  </div>
</header>
<div class="screen-controls">
  <div class="daily-controls" id="daily-controls">
    <button class="zpl-btn" id="daily-home-btn"><i class="ph-bold ph-house"></i> 홈</button>
    <input type="date" id="daily-date">
    <select id="daily-store"><option value="">매장: 전체</option></select>
    <label class="daily-toggle"><input type="checkbox" id="daily-include-printed"> 출력완료건 포함</label>
    <button class="zpl-btn" id="daily-reload-btn"><i class="ph-bold ph-arrows-clockwise"></i> 조회</button>
    <button class="zpl-btn" id="daily-kiosk-btn"><i class="ph-bold ph-download-simple"></i> 키오스크 업로드 파일</button>
  </div>
  <div class="btn-group" id="print-group">
    <button class="team-btn active" data-team="online">온라인</button>
    <button class="team-btn" data-team="logistics">물류</button>
    <button class="zpl-btn" id="zpl-btn"><i class="ph-bold ph-download-simple"></i> ZPL 다운로드</button>
    <button class="print-btn" id="zebra-btn"><i class="ph-bold ph-printer"></i> Zebra 직접 출력</button>
  </div>
</div>
<div class="not-found-box" id="not-found-box">
  <strong id="not-found-title"><i class="ph-bold ph-warning"></i> DB에서 찾지 못한 바코드</strong>
  <div id="not-found-list" style="font-family:monospace;font-size:13px;line-height:1.8;margin-top:4px"></div>
</div>
<div class="label-grid" id="label-grid"></div>
<script src="js/labels.js?v=202611170050"></script>
</body>
