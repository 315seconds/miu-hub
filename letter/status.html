<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>레터 열람 현황 — 마켓인유</title>
<meta name="theme-color" content="#faf9f5">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="/miu-hub/shared/tokens.css?v=202610250918">
<link rel="stylesheet" href="/miu-hub/shared/layout.css?v=202610250918">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
<style>
body { font-family: var(--miu-sans); background: var(--miu-canvas); color: var(--miu-ink); word-break: keep-all; }
.wrap { max-width: 560px; margin: 0 auto; padding: 8px 20px 48px; }
.week { margin-top: 28px; }
.week-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.week-head .t { font-family: var(--miu-serif); font-size: 20px; font-weight: 500; letter-spacing: -0.5px; }
.week-head .s { font-size: 13px; color: var(--miu-muted); }
.list { background: var(--miu-surface-card); border-radius: var(--miu-r-lg); overflow: hidden; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--miu-hairline-soft); }
.row:last-child { border-bottom: none; }
.row .n { font-size: 15px; font-weight: 600; }
.row .st { font-size: 13px; text-align: right; }
.st.read { color: var(--miu-success); font-weight: 600; }
.st.unread { color: var(--miu-primary-active); font-weight: 600; }
.st small { display: block; font-weight: 400; color: var(--miu-muted); margin-top: 1px; }
.row .right { display: flex; align-items: center; gap: 12px; }
.row .view { display: inline-flex; align-items: center; gap: 2px; padding: 6px 10px; border-radius: var(--miu-r-pill); border: 1px solid var(--miu-hairline); font-size: 12px; font-weight: 600; color: var(--miu-body); text-decoration: none; white-space: nowrap; }
.row .view:active { background: var(--miu-surface-strong); }
.empty { text-align: center; padding: 96px 32px; color: var(--miu-muted); font-size: 14px; line-height: 1.6; }
.hint { margin-top: 20px; font-size: 12.5px; color: var(--miu-muted); line-height: 1.6; }
.kind { margin: 36px 0 0; font-size: 13px; font-weight: 700; letter-spacing: 0.8px; color: var(--miu-primary); }
.kind + .week { margin-top: 12px; }
.row .n small { display: block; font-weight: 400; color: var(--miu-muted); font-size: 12px; margin-top: 1px; }
</style>
<script src="/miu-hub/shared/config.js?v=202610250918"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/miu-hub/shared/supabase-client.js?v=202610250918"></script>
<script src="/miu-hub/shared/auth-guard.js?v=202610250918"></script>
</head>
<body>

<header class="miu-header">
  <a href="/miu-hub/" class="miu-header-back" aria-label="허브로">
    <i class="ph-bold ph-caret-left"></i>
  </a>
  <div class="miu-header-title">
    <div class="miu-header-eyebrow">LETTERS</div>
    <h1 class="miu-header-h1">레터 열람 현황</h1>
  </div>
</header>

<div class="wrap" id="root"><div class="empty">불러오는 중…</div></div>

<script>
const root = document.getElementById('root');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const md = (iso) => { const [, m, d] = iso.split('-'); return `${+m}/${+d}`; };
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const fmtKst = (iso) => {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
    .formatToParts(new Date(iso)).map((x) => [x.type, x.value]));
  return `${p.month}/${p.day} ${p.hour}:${p.minute}`;
};
const daysSince = (iso) => Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);

const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const mdw = (iso) => `${md(iso)}(${DOW[new Date(iso + 'T00:00:00Z').getUTCDay()]})`;

const statusHtml = (r) => (r.read_at
  ? `<span class="st read">열람 완료<small>${fmtKst(r.read_at)}</small></span>`
  : `<span class="st unread">아직 안 읽음<small>${daysSince(r.created_at)}일 경과</small></span>`);

function weeklyHtml(rows) {
  const byWeek = new Map();
  rows.forEach((r) => { if (!byWeek.has(r.week_start)) byWeek.set(r.week_start, []); byWeek.get(r.week_start).push(r); });
  return `<div class="kind">주간 프라이싱 레터</div>` + [...byWeek].map(([week, rs]) => {
    const readN = rs.filter((r) => r.read_at).length;
    return `
      <section class="week">
        <div class="week-head"><span class="t">${md(week)} – ${md(addDays(week, 6))}</span><span class="s">${rs.length}명 중 ${readN}명 열람</span></div>
        <div class="list">${rs.map((r) => `
          <div class="row">
            <span class="n">${esc(r.recipient_name)}</span>
            <span class="right">
              ${statusHtml(r)}
              <a class="view" href="index.html?id=${encodeURIComponent(r.id)}&as=admin">레터 보기<i class="ph-bold ph-caret-right"></i></a>
            </span>
          </div>`).join('')}
        </div>
      </section>`;
  }).join('');
}

function salesHtml(rows) {
  const label = (r) => (r.period_start === r.period_end ? `${mdw(r.period_end)} 판매` : `${md(r.period_start)}~${md(r.period_end)} 판매(지난주)`);
  return `<div class="kind">판매 레터</div>
    <section class="week">
      <div class="list">${rows.map((r) => `
        <div class="row">
          <span class="n">${label(r)}<small>${esc(r.recipient_name)}</small></span>
          <span class="right">
            ${statusHtml(r)}
            <a class="view" href="../sales-letter/index.html?id=${encodeURIComponent(r.id)}&as=admin">레터 보기<i class="ph-bold ph-caret-right"></i></a>
          </span>
        </div>`).join('')}
      </div>
    </section>`;
}

(async function init() {
  for (let i = 0; i < 50 && window.MIU_PROFILE === undefined; i++) await new Promise((r) => setTimeout(r, 100));
  const [weekly, sales] = await Promise.all([window.sb.rpc('letter_read_status'), window.sb.rpc('sales_letter_read_status')]);
  if (weekly.error || sales.error) {
    root.innerHTML = '<div class="empty">불러오지 못했어요.</div>';
    return;
  }
  if (!weekly.data.length && !sales.data.length) {
    root.innerHTML = '<div class="empty">볼 수 있는 열람 현황이 없어요.</div>';
    return;
  }
  root.innerHTML = (weekly.data.length ? weeklyHtml(weekly.data) : '')
    + (sales.data.length ? salesHtml(sales.data) : '')
    + '<p class="hint">열람 시각은 수신자가 레터를 처음 열어본 때예요. “레터 보기”는 실제 발송된 레터를 읽기만 하며, 열람 기록은 바뀌지 않아요.</p>';
})();
</script>
</body>
</html>
