<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>판매 리포트 — 마켓인유</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="/miu-hub/shared/tokens.css?v=202611151334">
<link rel="stylesheet" href="/miu-hub/shared/layout.css?v=202611151334">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --brand:     var(--miu-primary);
  --bg:        var(--miu-canvas);
  --surface:   var(--miu-canvas);
  --fg:        var(--miu-ink);
  --fg2:       var(--miu-body);
  --fg3:       var(--miu-muted);
  --line:      var(--miu-hairline);
  --r:         12px;
  --fast-bg:   color-mix(in srgb, var(--miu-primary) 14%, var(--miu-canvas));  --fast-fg:  var(--miu-primary-active);
  --mid-bg:    color-mix(in srgb, var(--miu-warning) 20%, var(--miu-canvas));  --mid-fg:   var(--miu-warning-text);
  --norm-bg:   color-mix(in srgb, var(--miu-success) 12%, var(--miu-canvas));  --norm-fg:  var(--miu-success-text);
  --slow-bg:   var(--miu-surface-soft);  --slow-fg:  var(--miu-muted);
}

body {
  font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: var(--miu-canvas);
  color: var(--fg);
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
}

/* ── 날짜/요약 헤더 — 스크롤과 함께 흘려보낸다(매장 탭만 sticky) ── */
.report-head {
  background: var(--miu-canvas);
  padding: 12px 16px 8px;
}
.date-trigger {
  position: relative;
  display: inline-flex; align-items: center; gap: 8px;
  min-height: var(--miu-tap);
  cursor: pointer;
}
.date-trigger i { font-size: 20px; color: var(--miu-primary); }
.date-trigger input[type=date] {
  position: absolute; inset: 0; width: 100%; height: 100%;
  opacity: 0; cursor: pointer; font-size: 16px;
}
.report-date {
  font-family: var(--miu-serif);
  font-size: 24px; font-weight: 500; letter-spacing: -0.5px;
}
.report-kpi {
  display: flex; flex-wrap: wrap; gap: 6px 20px;
  font-size: 13px; color: var(--fg2);
  margin-bottom: 14px;
}
.kpi-val { font-weight: 700; color: var(--fg); }
.kpi-fast { color: var(--fast-fg); font-weight: 700; }

/* ── 매장 탭 ── */
.store-tabs {
  display: flex; gap: 0; overflow-x: auto;
  scrollbar-width: none;
  position: sticky; top: var(--miu-header-h); z-index: 9;
  background: var(--miu-canvas);
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  padding: 0 8px;
}
.store-tabs:empty { display: none; }
.store-tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0;
  min-height: var(--miu-tap); padding: 0 14px;
  font-size: 14px; font-weight: 600; color: var(--miu-muted);
  cursor: pointer; border-bottom: 2px solid transparent;
  white-space: nowrap; background: none; border-top: none; border-left: none; border-right: none;
  transition: color .15s, border-color .15s;
}
.tab.active { color: var(--brand); border-bottom-color: var(--brand); }

/* ── 빠른판매 하이라이트 ── */
.highlight-section {
  margin: 12px 14px 0;
}
.highlight-label {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px;
}
.highlight-title {
  font-size: 14px; font-weight: 800;
}
.highlight-sub {
  font-size: 13px; color: var(--fg3); font-weight: 500;
}
.highlight-scroll {
  display: flex; gap: 10px; overflow-x: auto;
  padding-bottom: 14px; scrollbar-width: none;
}
.highlight-scroll::-webkit-scrollbar { display: none; }

/* 하이라이트 미니 카드 */
.mini-card {
  flex-shrink: 0;
  width: 120px;
  background: var(--surface);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 1px 6px rgba(0,0,0,.07);
}
.mini-photo-area {
  position: relative;
  aspect-ratio: 3/4;
  background: var(--miu-surface-card);
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.mini-photo-area img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
}
.mini-no-photo { font-size: 12px; color: var(--miu-muted); }
.mini-info {
  padding: 7px 8px 8px;
}
.mini-price { font-size: 13px; font-weight: 800; }
.mini-store { font-size: 12px; color: var(--fg3); margin-top: 1px; }

/* ── 본문 ── */
.main { padding: 4px 14px 60px; }

/* ── 섹션 구분선 ── */
.section-divider {
  display: flex; align-items: center; gap: 10px;
  padding: 20px 0 12px; scroll-margin-top: var(--miu-header-h);
}
.section-divider-line { flex: 1; height: 1px; background: var(--line); }
.section-divider-label {
  font-size: 12px; font-weight: 700; color: var(--fg3);
  letter-spacing: .06em; white-space: nowrap;
}

.store-block { margin-bottom: 8px; } /* scroll-margin-top은 JS에서 동적 설정 */
.store-name-row {
  display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  padding: 0 0 10px;
}
.store-nm { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
.store-meta { font-size: 13px; color: var(--fg3); }
.store-fast-note { font-size: 13px; color: var(--fast-fg); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }

/* ── 카드 그리드 ── */
.card-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
@media (min-width: 440px) {
  .card-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (min-width: 640px) {
  .card-grid { grid-template-columns: repeat(4, 1fr); gap: 12px; }
}

/* ── 상품 카드 ── */
.card {
  background: var(--surface);
  border-radius: var(--r);
  overflow: hidden;
  box-shadow: 0 1px 6px rgba(0,0,0,.07);
}

.card-photo-area {
  position: relative;
  aspect-ratio: 3/4;
  background: var(--miu-surface-card);
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.card-photo-area img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
}
.card-no-photo { font-size: 12px; color: var(--miu-muted); }

/* 가격 오버레이 */
.price-pill {
  position: absolute; top: 8px; right: 8px; z-index: 2;
  background: rgba(255,255,255,0.93);
  backdrop-filter: blur(6px);
  border-radius: 20px;
  padding: 4px 9px;
  font-size: 13px; font-weight: 800; color: var(--fg);
  line-height: 1.2;
}

/* 카테고리 오버레이 */
.cat-pill {
  position: absolute; top: 8px; left: 8px; z-index: 2;
  background: rgba(0,0,0,.52);
  backdrop-filter: blur(6px);
  border-radius: 6px;
  padding: 3px 7px;
  font-size: 12px; font-weight: 700; color: #fff;
}

/* 판매속도 오버레이 띠 */
.speed-strip {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 2;
  padding: 6px 10px;
  font-size: 12px; font-weight: 800;
  line-height: 1.2;
}
.mini-card .speed-strip { padding: 6px 8px; white-space: nowrap; }
.speed-strip.fast { background: var(--fast-bg); color: var(--fast-fg); }
.speed-strip.mid  { background: var(--mid-bg);  color: var(--mid-fg);  }
.speed-strip.norm { background: var(--norm-bg); color: var(--norm-fg); }
.speed-strip.slow { background: color-mix(in srgb, var(--miu-surface-soft) 92%, transparent); color: var(--slow-fg); }

/* 카드 하단 */
.card-foot {
  padding: 8px 9px 10px;
}
.staff-row {
  display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 5px;
}
.staff-chip {
  font-size: 12px; color: var(--fg3);
  background: var(--miu-surface-soft);
  border-radius: 4px;
  padding: 2px 6px;
}
.brand-text {
  font-size: 13px; font-weight: 700; color: var(--fg2);
  margin-bottom: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.barcode-text {
  font-family: var(--miu-mono);
  font-size: 13px; color: var(--fg3);
  letter-spacing: .02em;
}

/* ── 범례 (인라인 텍스트) ── */
.legend-bar {
  display: flex; flex-wrap: wrap; gap: 8px;
  padding: 10px 14px;
  font-size: 13px; color: var(--fg3);
  align-items: center; border-bottom: 1px solid var(--line);
}
.legend-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 3px;
}

<body>

<!-- 상단 네비 (새 디자인) -->
<header class="miu-header">
  <a href="/miu-hub/" class="miu-header-back" aria-label="허브로">
    <i class="ph-bold ph-caret-left"></i>
  </a>
  <div class="miu-header-title">    <h1 class="miu-header-h1">판매 리포트</h1>
  </div>
  <div class="miu-header-actions">
    <button class="miu-icon-btn" id="btn-prev" aria-label="전날">
      <i class="ph-bold ph-caret-left"></i>
    </button>
    <button class="miu-icon-btn" id="btn-next" aria-label="다음날" disabled>
      <i class="ph-bold ph-caret-right"></i>
    </button>
  </div>
</header>

<!-- 날짜/KPI 헤더: 날짜를 누르면 달력으로 바로 이동 -->
<div class="report-head" id="report-head">
  <label class="date-trigger" aria-label="날짜 선택">
    <span class="report-date" id="report-date">불러오는 중…</span>
    <i class="ph-bold ph-calendar-blank"></i>
    <input type="date" id="date-pick">
  </label>
  <div class="report-kpi" id="report-kpi"></div>
</div>
<div class="store-tabs" id="store-tabs"></div>

<!-- 범례 -->
<div class="legend-bar">
  <span><span class="legend-dot" style="background:var(--fast-fg)"></span><i class="ph-bold ph-fire"></i> 3일 이내 — 가격 높였어도 될 가능성</span>
  <span><span class="legend-dot" style="background:var(--mid-fg)"></span><i class="ph-bold ph-lightning"></i> 4–7일</span>
</div>

<!-- 메인 콘텐츠 -->
<div id="app-body">
  <div class="miu-loading"><span class="miu-spinner"></span>데이터 로딩 중</div>
</div>

<script>
// ── 설정 ──────────────────────────────────────────────────────────────
const SB_URL = window.MIU_CONFIG.SUPABASE_URL;
const KST_OFFSET = 9 * 60; // KST = UTC+9

// ── 날짜 유틸 ────────────────────────────────────────────────────────
function todayKST() {
  const d = new Date(Date.now() + KST_OFFSET * 60000);
  return d.toISOString().slice(0, 10);
}
function kstYesterday() {
  const d = new Date(Date.now() + KST_OFFSET * 60000 - 86400000);
  return d.toISOString().slice(0, 10);
}
function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function daysBetween(from, to) {
  if (!from || !to) return null;
  const a = new Date(from.slice(0,10)+'T00:00:00Z');
  const b = new Date(to.slice(0,10)+'T00:00:00Z');
  return Math.round((b - a) / 86400000);
}
function formatDate(str) {
  const d = new Date(str + 'T00:00:00Z');
  const dow = ['일','월','화','수','목','금','토'][d.getUTCDay()];
  return `${d.getUTCFullYear()}년 ${d.getUTCMonth()+1}월 ${d.getUTCDate()}일 (${dow})`;
}
function displayStore(raw) {
  return raw.replace('공동판매', '').trim();
}
function h(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Supabase fetch ────────────────────────────────────────────────────
// 로그인한 직원의 세션 토큰으로 요청한다. 공개 키만으로는 데이터를 읽을 수 없다.
async function sbHeaders() {
  const { data } = await window.sb.auth.getSession();
  const token = data.session?.access_token;
  if (!token) throw new Error('로그인이 필요해요. 다시 로그인해 주세요.');
  return {
    apikey: window.MIU_CONFIG.SUPABASE_ANON_KEY,
    Authorization: `Bearer ${token}`,
    Accept: 'application/json',
  };
}

async function sbGet(table, params) {
  const qs = new URLSearchParams(params).toString();
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${qs}`, { headers: await sbHeaders() });
  if (!r.ok) throw new Error(`Supabase ${table}: ${r.status}`);
  return r.json();
}

async function sbChunked(table, base, key, values, size = 200) {
  const out = [];
  for (let i = 0; i < values.length; i += size) {
    const chunk = values.slice(i, i + size);
    const p = { ...base, [key]: `in.(${chunk.join(',')})` };
    const rows = await sbGet(table, p);
    out.push(...rows);
  }
  return out;
}

// ── 데이터 페치 ──────────────────────────────────────────────────────
async function loadReport(dateStr) {
  // 1. 판매 데이터 (PB 제외)
  const soldRaw = await sbGet('sold_items', {
    sold_date: `eq.${dateStr}`,
    price: 'gt.0',
    select: 'barcode,store,sold_date,price',
  });
  const sold = soldRaw.filter(r => !r.barcode.toUpperCase().startsWith('PB'));
  if (!sold.length) return [];

  const barcodes = [...new Set(sold.map(r => r.barcode))];

  // 2. 재고 정보
  const invRows = await sbChunked('inventory_items', {
    select: 'barcode,category,photo_url,session_id,hanger_id,created_at,brand',
  }, 'barcode', barcodes);
  const invMap = Object.fromEntries(invRows.map(r => [r.barcode, r]));

  // 3. 입고 세션 + 행거
  const sessionIds = [...new Set(invRows.filter(r => r.session_id).map(r => r.session_id))];
  const sessionMap = {};
  if (sessionIds.length) {
    const sRows = await sbChunked('inventory_sessions', {
      select: 'id,session_date',
    }, 'id', sessionIds);
    for (const r of sRows) sessionMap[r.id] = r;
  }

  const hangerIds = [...new Set(invRows.filter(r => r.hanger_id).map(r => r.hanger_id))];
  const hangerMap = {};
  if (hangerIds.length) {
    const hRows = await sbChunked('inventory_hangers', {
      select: 'id,submitted_by',
    }, 'id', hangerIds);
    for (const r of hRows) hangerMap[r.id] = r;
  }

  // 4. 이동이력 (session_items → move_sessions)
  const siRows = await sbChunked('session_items', {
    is_submitted: 'eq.true',
    is_error:     'eq.false',
    select:       'barcode,session_id',
  }, 'barcode', barcodes);

  const msIds = [...new Set(siRows.map(r => r.session_id))];
  const msMap = {};
  if (msIds.length) {
    const msRows = await sbChunked('move_sessions', {
      status: 'eq.approved',
      select: 'id,to_location,approved_at,created_by',
    }, 'id', msIds);
    for (const r of msRows) if (r.approved_at) msMap[r.id] = r;
  }

  // 바코드별 이동이력 조합 (approved_at 내림차순)
  const movesMap = {};
  for (const si of siRows) {
    const ms = msMap[si.session_id];
    if (!ms) continue;
    (movesMap[si.barcode] = movesMap[si.barcode] || []).push(ms);
  }
  for (const bc in movesMap) {
    movesMap[bc].sort((a, b) => b.approved_at.localeCompare(a.approved_at));
  }

  // 5. 가격수정 이력 (바코드별 최신 1건)
  const pcRows = await sbChunked('price_changes', {
    select: 'barcode,changed_by,changed_at',
    order:  'changed_at.desc',
  }, 'barcode', barcodes);
  const pcMap = {};
  for (const r of pcRows) if (!pcMap[r.barcode]) pcMap[r.barcode] = r;

  // 6. 조합
  return sold.map(s => {
    const bc   = s.barcode;
    const inv  = invMap[bc];
    const sess = inv?.session_id ? sessionMap[inv.session_id] : null;
    const moves = movesMap[bc] || [];
    const loc  = displayStore(s.store);
    const lastMove = moves.find(m => (m.to_location || '').trim() === loc);

    const receiveDate = sess?.session_date || inv?.created_at?.slice(0, 10) || null;
    const daysSinceReceive = daysBetween(receiveDate, s.sold_date);
    const daysSinceMove    = lastMove?.approved_at ? daysBetween(lastMove.approved_at.slice(0,10), s.sold_date) : null;

    return {
      barcode:         bc,
      store:           s.store,
      price:           s.price,
      category:        inv?.category || '',
      photoUrl:        inv?.photo_url || '',
      brand:           inv?.brand || '',
      daysSinceReceive,
      daysSinceMove,
      receivedBy:      hangerMap[inv?.hanger_id]?.submitted_by || '',
      priceChangedBy:  pcMap[bc]?.changed_by || '',
    };
  });
}

// ── 속도 계산 ─────────────────────────────────────────────────────────
// 이동 타이밍(빠른판매 판단 기준) + 입고 타이밍(총 보유기간)을 함께 표시
function speedInfo(item) {
  const md = item.daysSinceMove;
  const rd = item.daysSinceReceive;

  // 이동 데이터가 있으면 이동 기준으로 속도 분류
  if (md !== null) {
    let cls, base;
    if (md === 0)      { cls = 'fast'; base = '당일 판매 <i class="ph-bold ph-fire"></i>'; }
    else if (md <= 3)  { cls = 'fast'; base = `이동 ${md}일 <i class="ph-bold ph-fire"></i>`; }
    else if (md <= 7)  { cls = 'mid';  base = `이동 ${md}일 <i class="ph-bold ph-lightning"></i>`; }
    else               { cls = 'slow'; base = `이동 ${md}일`; }
    const text = rd !== null ? `${base} · 입고 ${rd}일` : base;
    return { cls, text };
  }

  // 이동 데이터 없으면 입고 기준
  if (rd !== null) {
    if (rd === 0)  return { cls: 'fast', text: '당일 판매 <i class="ph-bold ph-fire"></i>' };
    if (rd <= 3)   return { cls: 'fast', text: `입고 ${rd}일 <i class="ph-bold ph-fire"></i>` };
    if (rd <= 7)   return { cls: 'mid',  text: `입고 ${rd}일 <i class="ph-bold ph-lightning"></i>` };
    return { cls: 'slow', text: `입고 ${rd}일` };
  }

  return { cls: '', text: '' };
}

// ── 렌더 ─────────────────────────────────────────────────────────────
function renderCard(item, mini = false) {
  const sp   = speedInfo(item);
  const photo = item.photoUrl
    ? `<img src="${h(item.photoUrl)}" loading="lazy" onerror="this.remove()" alt="">`
    : `<span class="${mini?'mini-no-photo':'card-no-photo'}">사진없음</span>`;
  const speed = sp.text ? `<div class="speed-strip ${sp.cls}">${sp.text}</div>` : '';
  const price = `<div class="price-pill">${item.price.toLocaleString()}원</div>`;
  const cat   = item.category ? `<div class="cat-pill">${h(item.category)}</div>` : '';

  if (mini) {
    const miniSpeed = sp.text ? `<div class="speed-strip ${sp.cls}">${sp.text.replace(/ · 입고 \d+일$/, '')}</div>` : '';
    return `<div class="mini-card">
      <div class="mini-photo-area">${photo}${miniSpeed}</div>
      <div class="mini-info">
        <div class="mini-price">${item.price.toLocaleString()}원</div>
        <div class="mini-store">${h(displayStore(item.store))}</div>
      </div>
    </div>`;
  }

  const staff = [
    item.receivedBy     ? `<span class="staff-chip">입고 ${h(item.receivedBy)}</span>`     : '',
    item.priceChangedBy ? `<span class="staff-chip">가격 ${h(item.priceChangedBy)}</span>` : '',
  ].filter(Boolean).join('');

  return `<div class="card">
    <div class="card-photo-area">
      ${photo}${price}${cat}${speed}
    </div>
    <div class="card-foot">
      ${item.brand ? `<div class="brand-text">${h(item.brand)}</div>` : ''}
      ${staff ? `<div class="staff-row">${staff}</div>` : ''}
      <div class="barcode-text">${h(item.barcode)}</div>
    </div>
  </div>`;
}

function sortItems(items) {
  return [...items].sort((a, b) => {
    const sa = a.daysSinceMove ?? a.daysSinceReceive ?? 9999;
    const sb = b.daysSinceMove ?? b.daysSinceReceive ?? 9999;
    if (sa !== sb) return sa - sb;       // 속도 오름차순
    return b.price - a.price;            // 가격 내림차순
  });
}

function renderStoreBlock(storeName, items) {
  const display = displayStore(storeName);
  const total   = items.reduce((s, i) => s + i.price, 0);
  const fast    = items.filter(i => (i.daysSinceMove ?? i.daysSinceReceive ?? 99) <= 3).length;
  const fastNote = fast ? `<span class="store-fast-note"><i class="ph-bold ph-fire"></i> ${fast}건 빠른판매</span>` : '';
  const cards   = sortItems(items).map(i => renderCard(i)).join('');

  return `<div class="store-block" id="store-${h(storeName)}">
    <div class="store-name-row">
      <span class="store-nm">${h(display)}</span>
      <span class="store-meta">${items.length}건 · ${total.toLocaleString()}원</span>
      ${fastNote}
    </div>
    <div class="card-grid">${cards}</div>
  </div>`;
}

function renderFull(items) {
  // 빠른판매 필터
  const fast = items.filter(i => (i.daysSinceMove ?? i.daysSinceReceive ?? 99) <= 3);

  // 매장별 그룹 (건수 내림차순)
  const byStore = {};
  for (const item of items) {
    (byStore[item.store] = byStore[item.store] || []).push(item);
  }
  const stores = Object.entries(byStore).sort((a, b) => b[1].length - a[1].length);

  let html = '';

  // 빠른판매 하이라이트 띠
  if (fast.length) {
    const miniCards = fast.map(i => renderCard(i, true)).join('');
    html += `<div class="highlight-section">
      <div class="highlight-label">
        <span class="highlight-title"><i class="ph-bold ph-fire"></i> 빠른판매 ${fast.length}건</span>
        <span class="highlight-sub">가격 재검토 고려</span>
      </div>
      <div class="highlight-scroll">${miniCards}</div>
    </div>`;
  }

  // 섹션 구분선
  html += `<div class="section-divider">
    <div class="section-divider-line"></div>
    <div class="section-divider-label">매장별 전체 판매</div>
    <div class="section-divider-line"></div>
  </div>`;

  // 매장별 블록
  html += stores.map(([name, its]) => renderStoreBlock(name, its)).join('');

  return `<div class="main">${html}</div>`;
}

// ── KPI / 탭 헤더 ────────────────────────────────────────────────────
function updateHeader(dateStr, items) {
  document.getElementById('report-date').textContent = formatDate(dateStr);

  const total   = items.reduce((s, i) => s + i.price, 0);
  const fast    = items.filter(i => (i.daysSinceMove ?? i.daysSinceReceive ?? 99) <= 3).length;
  const fastPct = items.length ? Math.round(fast / items.length * 100) : 0;

  document.getElementById('report-kpi').innerHTML = `
    <span>총 <span class="kpi-val">${items.length}건</span></span>
    <span>합계 <span class="kpi-val">${total.toLocaleString()}원</span></span>
    ${fast ? `<span class="kpi-fast"><i class="ph-bold ph-fire"></i> 빠른판매 ${fast}건 (${fastPct}%)</span>` : ''}
  `;

  // 매장 탭
  const byStore = {};
  for (const item of items) (byStore[item.store] = byStore[item.store] || []).push(item);
  const sorted = Object.entries(byStore).sort((a, b) => b[1].length - a[1].length);

  const tabs = document.getElementById('store-tabs');
  tabs.innerHTML = sorted.map(([name, its], idx) => `
    <button class="tab${idx===0?' active':''}" data-store="${h(name)}">
      ${h(displayStore(name))} ${its.length}
    </button>
  `).join('');

  tabs.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      tabs.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      const el = document.getElementById(`store-${btn.dataset.store}`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

// ── 스크롤 헬퍼 ──────────────────────────────────────────────────────

// sticky 헤더 전체 높이를 기준으로 store-block의 scroll-margin-top을 동적 설정
function updateScrollMargins() {
  const navH  = document.querySelector('.miu-header').offsetHeight;
  const headH = document.querySelector('#store-tabs').offsetHeight;
  const margin = navH + headH + 6; // +6px 여유
  document.querySelectorAll('.store-block').forEach(el => {
    el.style.scrollMarginTop = margin + 'px';
  });
}

// 스크롤 위치에 따라 탭 active 상태 자동 갱신
let _spyCleanup = null;
function setupScrollSpy() {
  if (_spyCleanup) _spyCleanup();

  const tabs = document.getElementById('store-tabs');
  const blocks = [...document.querySelectorAll('.store-block')];
  if (!blocks.length) return;

  const handler = () => {
    const navH  = document.querySelector('.miu-header').offsetHeight;
    const headH = document.querySelector('#store-tabs').offsetHeight;
    const threshold = window.scrollY + navH + headH + 20;

    let current = null;
    for (const block of blocks) {
      if (block.offsetTop <= threshold) current = block;
    }
    if (!current) return;
    const store = current.id.replace(/^store-/, '');
    tabs.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.store === store);
    });
  };

  window.addEventListener('scroll', handler, { passive: true });
  _spyCleanup = () => window.removeEventListener('scroll', handler);
}

// ── 앱 상태 ──────────────────────────────────────────────────────────
let currentDate = kstYesterday();
const today     = todayKST();

function setDateNav() {
  document.getElementById('btn-prev').disabled = false;
  document.getElementById('btn-next').disabled = currentDate >= today;
  const pick = document.getElementById('date-pick');
  pick.value = currentDate;
  pick.max = today;
}

async function renderDate(dateStr) {
  const body = document.getElementById('app-body');
  const head = document.getElementById('report-date');
  head.textContent = formatDate(dateStr);
  document.getElementById('report-kpi').innerHTML = '';
  document.getElementById('store-tabs').innerHTML = '';
  body.innerHTML = `<div class="miu-loading"><span class="miu-spinner"></span>불러오는 중</div>`;

  try {
    const items = await loadReport(dateStr);

    if (!items.length) {
      body.innerHTML = `<div class="miu-state">
        <div class="miu-state-icon"><i class="ph-bold ph-tray"></i></div>
        <div class="miu-state-title">판매 데이터 없음</div>
        <div class="miu-state-desc">${h(dateStr)}</div>
      </div>`;
      document.getElementById('report-date').textContent = formatDate(dateStr);
      document.getElementById('report-kpi').innerHTML = '';
      return;
    }

    updateHeader(dateStr, items);
    body.innerHTML = renderFull(items);
    // sticky 헤더 높이 확정 후 scroll-margin 재계산 + 스파이 시작
    requestAnimationFrame(() => {
      updateScrollMargins();
      setupScrollSpy();
    });

  } catch(err) {
    body.innerHTML = `<div class="miu-state">
      <div class="miu-state-icon"><i class="ph-bold ph-warning"></i></div>
      <div class="miu-state-title">데이터를 불러오지 못했어요</div>
      <div class="miu-state-desc">${h(String(err))}</div>
      <button class="miu-btn miu-btn-primary" onclick="renderDate(currentDate)">다시 시도</button>
    </div>`;
  }
}

// ── 이벤트 ───────────────────────────────────────────────────────────
document.getElementById('btn-prev').addEventListener('click', () => {
  currentDate = addDays(currentDate, -1);
  setDateNav();
  renderDate(currentDate);
});
document.getElementById('btn-next').addEventListener('click', () => {
  if (currentDate >= today) return;
  currentDate = addDays(currentDate, 1);
  setDateNav();
  renderDate(currentDate);
});
document.getElementById('date-pick').addEventListener('change', e => {
  const v = e.target.value;
  if (!v) return;
  currentDate = v > today ? today : v;
  setDateNav();
  renderDate(currentDate);
});

// ── 초기 실행 ─────────────────────────────────────────────────────────
setDateNav();
renderDate(currentDate);
</script>
</body>
</html>
