<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>마켓인유</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f54e00">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="마켓인유">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  /* WDS 토큰 — 마켓인유 오렌지 오버라이드 */
  --bg-primary:          #FFFFFF;
  --bg-secondary:        #F7F7F8;
  --bg-tertiary:         #F4F4F5;
  --fg-primary:          #171719;
  --fg-secondary:        rgba(70,71,76,0.86);
  --fg-tertiary:         #989BA2;
  --fg-disabled:         #C2C4C8;
  --line-default:        rgba(112,115,124,0.22);
  --line-strong:         #46474C;
  --brand-primary:       #f54e00;
  --brand-primary-hover: #d04200;
  --status-success:      #00BF40;
  --status-warning:      #FF5E00;
  --status-danger:       #E52222;
  --shadow-1: 0 1px 2px rgba(23,23,23,0.06), 0 1px 1px rgba(0,0,0,0.07);
  --shadow-2: 0 4px 8px rgba(23,23,23,0.07), 0 2px 4px rgba(0,0,0,0.06);
  --r-sm:   8px;
  --r-md:  12px;
  --r-lg:  16px;
  --r-xl:  20px;
}

body {
  background: var(--bg-secondary);
  font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  color: var(--fg-primary);
}

.header {
  background: var(--bg-primary);
  border-bottom: 1px solid var(--line-default);
  padding: 20px 20px 16px;
}
.header-brand {
  font-size: 11px;
  font-weight: 700;
  color: var(--brand-primary);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.header-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--fg-primary);
  letter-spacing: -0.4px;
}
.header-sub {
  font-size: 13px;
  color: var(--fg-tertiary);
  margin-top: 3px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 20px;
}

.tile {
  background: var(--bg-primary);
  border: 1px solid var(--line-default);
  border-radius: var(--r-lg);
  padding: 20px 16px 18px;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: var(--shadow-1);
  transition: box-shadow .15s, transform .12s;
}
.tile:active {
  transform: scale(0.97);
  box-shadow: none;
}
.tile-icon { font-size: 26px; line-height: 1; }
.tile-label {
  font-size: 15px;
  font-weight: 600;
  color: var(--fg-primary);
  letter-spacing: -0.2px;
  line-height: 1.3;
}
.tile-desc {
  font-size: 12px;
  color: var(--fg-tertiary);
  line-height: 1.45;
}

/* 섹션별 왼쪽 강조 */
.tile-receiving  { border-left: 3px solid #3b82f6; }
.tile-move       { border-left: 3px solid #8b5cf6; }
.tile-longterm   { border-left: 3px solid #f54e00; }
.tile-dashboard  { border-left: 3px solid #22c55e; }
.tile-report     { border-left: 3px solid #f59e0b; }
.tile-inventory  { border-left: 3px solid #06b6d4; }

.footer {
  text-align: center;
  padding: 8px 20px 32px;
  font-size: 11px;
  color: var(--fg-disabled);
}
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">MARKET IN U</div>
  <div class="header-title">마켓인유 관리툴</div>
  <div class="header-sub" id="today-label"></div>
</div>

<div class="grid">
  <a href="receiving/" class="tile tile-receiving">
    <div class="tile-icon">📦</div>
    <div>
      <div class="tile-label">신규입고</div>
      <div class="tile-desc">바코드 등록 · 세션 관리 · 라벨 출력</div>
    </div>
  </a>

  <a href="move/" class="tile tile-move">
    <div class="tile-icon">🔄</div>
    <div>
      <div class="tile-label">물류이동</div>
      <div class="tile-desc">매장간 이동 · 이동 승인 · 경로 조회</div>
    </div>
  </a>

  <a href="longterm/" class="tile tile-longterm">
    <div class="tile-icon">🏷</div>
    <div>
      <div class="tile-label">장기재고 처리</div>
      <div class="tile-desc">가격수정 · 이동복사 · 키오스크 반영</div>
    </div>
  </a>

  <a href="dashboard/" class="tile tile-dashboard">
    <div class="tile-icon">📊</div>
    <div>
      <div class="tile-label">매장 현황판</div>
      <div class="tile-desc">재고 현황 · 나이별 분포 · 월매출</div>
    </div>
  </a>

  <a href="report/" class="tile tile-report">
    <div class="tile-icon">📈</div>
    <div>
      <div class="tile-label">매출리포트</div>
      <div class="tile-desc">월별 리포트 · 팝업 아카이브</div>
    </div>
  </a>

  <a href="inventory-check/" class="tile tile-inventory">
    <div class="tile-icon">🔍</div>
    <div>
      <div class="tile-label">재고조사</div>
      <div class="tile-desc">행거별 스캔 · CSV 다운로드</div>
    </div>
  </a>
</div>

<div class="footer">마켓인유 내부 관리툴</div>

<script>
const days = ['일','월','화','수','목','금','토'];
const d = new Date();
document.getElementById('today-label').textContent =
  `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
</script>
</body>
</html>
