<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>마켓인유</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #f54e00;
  --ink: #26251e;
  --body: #5a5852;
  --muted: #807d72;
  --hairline: #e6e5e0;
  --canvas: #f7f7f4;
  --surface: #ffffff;
}

body {
  background: var(--canvas);
  font-family: 'Inter', system-ui, sans-serif;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}

.header {
  background: var(--surface);
  border-bottom: 1px solid var(--hairline);
  padding: 20px 20px 16px;
}

.header-brand {
  font-size: 11px;
  font-weight: 600;
  color: var(--primary);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.header-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.4px;
}

.header-sub {
  font-size: 13px;
  color: var(--muted);
  margin-top: 3px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 20px;
}

.tile {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: 16px;
  padding: 20px 16px 18px;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: box-shadow .15s, transform .12s;
  -webkit-tap-highlight-color: transparent;
}

.tile:active {
  transform: scale(0.97);
  box-shadow: none;
}

.tile-icon {
  font-size: 28px;
  line-height: 1;
}

.tile-label {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.2px;
  line-height: 1.3;
}

.tile-desc {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.4;
}

/* 타일별 왼쪽 강조색 */
.tile-receiving  { border-left: 3px solid #3b82f6; }
.tile-move       { border-left: 3px solid #8b5cf6; }
.tile-longterm   { border-left: 3px solid #f54e00; }
.tile-dashboard  { border-left: 3px solid #22c55e; }
.tile-report     { border-left: 3px solid #f59e0b; }
.tile-inventory  { border-left: 3px solid #06b6d4; }

.footer {
  text-align: center;
  padding: 8px 20px 32px;
  font-size: 11px;
  color: var(--muted);
}
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">MARKET IN U</div>
  <div class="header-title">마켓인유 관리툴</div>
  <div class="header-sub" id="today-label"></div>
</div>

<div class="grid">
  <a href="receiving/" class="tile tile-receiving">
    <div class="tile-icon">📦</div>
    <div>
      <div class="tile-label">신규입고</div>
      <div class="tile-desc">바코드 등록 · 세션 관리 · 라벨 출력</div>
    </div>
  </a>

  <a href="move/" class="tile tile-move">
    <div class="tile-icon">🔄</div>
    <div>
      <div class="tile-label">물류이동</div>
      <div class="tile-desc">매장간 이동 · 이동 승인 · 경로 조회</div>
    </div>
  </a>

  <a href="longterm/" class="tile tile-longterm">
    <div class="tile-icon">🏷</div>
    <div>
      <div class="tile-label">장기재고 처리</div>
      <div class="tile-desc">가격수정 · 이동복사 · 키오스크 반영</div>
    </div>
  </a>

  <a href="dashboard/" class="tile tile-dashboard">
    <div class="tile-icon">📊</div>
    <div>
      <div class="tile-label">매장 현황판</div>
      <div class="tile-desc">재고 현황 · 나이별 분포 · 월매출</div>
    </div>
  </a>

  <a href="report/" class="tile tile-report">
    <div class="tile-icon">📈</div>
    <div>
      <div class="tile-label">매출리포트</div>
      <div class="tile-desc">월별 리포트 · 팝업 아카이브</div>
    </div>
  </a>

  <a href="inventory-check/" class="tile tile-inventory">
    <div class="tile-icon">🔍</div>
    <div>
      <div class="tile-label">재고조사</div>
      <div class="tile-desc">행거별 스캔 · CSV 다운로드</div>
    </div>
  </a>
</div>

<div class="footer">마켓인유 내부 관리툴</div>

<script>
const days = ['일','월','화','수','목','금','토'];
const d = new Date();
document.getElementById('today-label').textContent =
  `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
</script>
</body>
</html>
