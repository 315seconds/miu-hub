<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>입고 로그</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="/shared/tokens.css?v=202609210706">
  <link rel="stylesheet" href="/shared/layout.css?v=202609210706">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="stylesheet" href="css/style.css?v=202609210706">
  <!-- auth-migration: 로그인 가드 -->
  <script src="/shared/config.js?v=202609210706"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/shared/supabase-client.js?v=202609210706"></script>
  <script src="/shared/auth-guard.js?v=202609210706"></script>
</head>
<body>
  <div class="page-wrap">
    <header class="miu-header">
      <a href="index.html" class="miu-header-back" aria-label="뒤로">
        <i class="ph-bold ph-caret-left"></i>
      </a>
      <div class="miu-header-title">        <h1 class="miu-header-h1">입고 로그</h1>
      </div>
    </header>

    <div class="page-body">
      <div id="error-msg" class="error" style="display:none"></div>

      <div class="log-filter-bar">
        <button class="log-filter-btn active" data-filter="today">오늘</button>
        <button class="log-filter-btn" data-filter="week">이번 주</button>
        <button class="log-filter-btn" data-filter="month">이번 달</button>
        <button class="log-filter-btn" data-filter="custom">직접 입력</button>
      </div>

      <div class="log-custom-range" id="custom-range">
        <input type="date" id="date-from">
        <span style="color:var(--fg-tertiary)">~</span>
        <input type="date" id="date-to">
        <button class="btn btn-primary btn-sm" id="custom-load-btn" style="width:56px; flex-shrink:0">조회</button>
      </div>

      <div id="log-list"><div class="log-loading">불러오는 중...</div></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js?v=202609210706"></script>
  <script src="js/api.js?v=202609210706"></script>
  <script src="js/logs.js?v=202609210706"></script>
  <script src="js/shared.js?v=202609210706"></script>
</body>
</html>
