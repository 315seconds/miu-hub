<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>물건 조회</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="/shared/tokens.css?v=202609210706">
  <link rel="stylesheet" href="/shared/layout.css?v=202609210706">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="stylesheet" href="css/style.css?v=202609210706">
  <!-- auth-migration: 로그인 가드 -->
  <script src="/shared/config.js?v=202609210706"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/shared/supabase-client.js?v=202609210706"></script>
  <script src="/shared/auth-guard.js?v=202609210706"></script>
</head>
<body>
  <div class="page-wrap">
    <header class="miu-header">
      <a href="../" class="miu-header-back" aria-label="허브로">
        <i class="ph-bold ph-caret-left"></i>
      </a>
      <div class="miu-header-title">        <h1 class="miu-header-h1">통합 물건 조회</h1>
      </div>
    </header>

    <div class="page-body">
      <div id="error-msg" class="error" style="display:none"></div>

      <!-- 탭 -->
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="scan">📷 리더기</button>
        <button class="tab-btn" data-tab="manual">✏️ 직접입력</button>
        <button class="tab-btn" data-tab="filter">🔍 필터검색</button>
      </div>

      <!-- 스캔 탭 -->
      <div class="tab-panel active" id="panel-scan">
        <div class="scan-box">
          <div class="scan-input-wrap">
            <input class="scan-input-field" id="barcode-input" placeholder="바코드를 스캔하세요..."
                   autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
          </div>
        </div>
      </div>

      <!-- 직접 입력 탭 -->
      <div class="tab-panel" id="panel-manual">
        <div class="scan-box">
          <div class="scan-input-wrap">
            <input class="scan-input-field" id="manual-barcode" placeholder="바코드 입력 후 Enter..."
                   autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
          </div>
          <textarea id="paste-area" class="manual-textarea"
                    placeholder="여러 개 붙여넣기&#10;C24578&#10;C24579"></textarea>
          <button class="btn btn-outline btn-block mt8" id="paste-btn">붙여넣기 추가</button>
        </div>
      </div>

      <!-- 필터 검색 탭 -->
      <div class="tab-panel" id="panel-filter">
        <div class="scan-box">
          <div id="filter-loading" class="scan-empty">옵션 불러오는 중...</div>
          <div id="filter-fields" style="display:none">
            <div class="filter-row">
              <span class="filter-label">카테고리</span>
              <select id="f-category"><option value="">전체</option></select>
            </div>
            <div class="filter-row">
              <span class="filter-label">브랜드</span>
              <input type="text" id="f-brand" placeholder="입력 (대소문자 무관)">
            </div>
            <div class="filter-row">
              <span class="filter-label">지점</span>
              <select id="f-location"><option value="">전체</option></select>
            </div>
            <div class="filter-row">
              <span class="filter-label">색상</span>
              <select id="f-color"><option value="">전체</option></select>
            </div>
            <div class="filter-row">
              <span class="filter-label">패턴</span>
              <select id="f-pattern"><option value="">전체</option></select>
            </div>
            <div class="filter-row">
              <span class="filter-label">상태</span>
              <select id="f-status">
                <option value="in_stock">보유중만</option>
                <option value="">전체 (판매완료 포함)</option>
              </select>
            </div>
          </div>
        </div>
        <button class="btn btn-primary btn-block" id="filter-search-btn" disabled>🔍 조회하기</button>
        <div id="filter-result" style="margin-top:16px"></div>
      </div>

      <!-- 스캔 목록 + 조회 버튼 -->
      <div id="scan-area" style="margin-top:10px">
        <div class="scan-box" id="scan-box">
          <div id="scan-empty" class="scan-empty">바코드를 추가하면 여기에 표시됩니다</div>
          <div id="scan-list"></div>
        </div>
        <div class="flex mt8" style="align-items:center; gap:12px">
          <span class="count-badge"><span id="count">0</span>개</span>
          <button class="btn btn-primary flex-1" id="search-btn" disabled>🔍 조회하기</button>
          <button class="btn btn-outline btn-sm" id="clear-btn">전체 삭제</button>
        </div>
      </div>

      <!-- 결과 -->
      <div id="result" style="margin-top:16px"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="js/supabase-client.js?v=202609210706"></script>
  <script src="js/api.js?v=202609210706"></script>
  <script src="js/items.js?v=202609210706"></script>
  <script src="js/shared.js?v=202609210706"></script>
</body>
</html>
