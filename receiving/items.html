<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>물건 조회</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page-wrap">
    <div class="page-header">
      <div class="page-header-inner">
        <div class="page-header-left">
          <a href="javascript:history.back()" class="back-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><polyline points="15 18 9 12 15 6"/></svg>
          </a>
        </div>
        <div class="page-header-title">물건 조회</div>
        <div class="page-header-right" style="width:38px"></div>
      </div>
    </div>

    <div class="page-body">
      <div id="error-msg" class="error" style="display:none"></div>

      <!-- 탭 -->
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="scan">📷 리더기 스캔</button>
        <button class="tab-btn" data-tab="manual">✏️ 직접 입력</button>
      </div>

      <!-- 스캔 탭 -->
      <div class="tab-panel active" id="panel-scan">
        <div class="scan-box">
          <div class="scan-input-wrap">
            <input class="scan-input-field" id="barcode-input" placeholder="바코드를 스캔하세요..."
                   autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
          </div>
        </div>
      </div>

      <!-- 직접 입력 탭 -->
      <div class="tab-panel" id="panel-manual">
        <div class="scan-box">
          <div class="scan-input-wrap">
            <input class="scan-input-field" id="manual-barcode" placeholder="바코드 입력 후 Enter..."
                   autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
          </div>
          <textarea id="paste-area" class="manual-textarea"
                    placeholder="여러 개 붙여넣기&#10;C24578&#10;C24579"></textarea>
          <button class="btn btn-outline btn-block mt8" id="paste-btn">붙여넣기 추가</button>
        </div>
      </div>

      <!-- 스캔 목록 + 조회 버튼 -->
      <div id="scan-area" style="margin-top:10px">
        <div class="scan-box" id="scan-box">
          <div id="scan-empty" class="scan-empty">바코드를 추가하면 여기에 표시됩니다</div>
          <div id="scan-list"></div>
        </div>
        <div class="flex mt8" style="align-items:center; gap:12px">
          <span class="count-badge"><span id="count">0</span>개</span>
          <button class="btn btn-primary flex-1" id="search-btn" disabled>🔍 조회하기</button>
          <button class="btn btn-outline btn-sm" id="clear-btn">전체 삭제</button>
        </div>
      </div>

      <!-- 결과 -->
      <div id="result" style="margin-top:16px"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/api.js"></script>
  <script src="js/items.js"></script>
  <script src="js/shared.js"></script>
</body>
</html>
