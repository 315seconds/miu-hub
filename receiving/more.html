<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>더보기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/layout.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- auth-migration: 로그인 가드 -->
  <script src="/shared/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/shared/supabase-client.js"></script>
  <script src="/shared/auth-guard.js"></script>
</head>
<body>
  <div class="page-wrap">
    <header class="miu-header">
      <a href="index.html" class="miu-header-back" aria-label="뒤로">
        <i class="ph-bold ph-caret-left"></i>
      </a>
      <div class="miu-header-title">        <h1 class="miu-header-h1">더보기</h1>
      </div>
    </header>

    <div class="page-body">
      <a href="logs.html" style="text-decoration:none">
        <div class="card" style="display:flex; align-items:center; gap:14px; padding:18px; margin-bottom:10px; cursor:pointer">
          <span style="font-size:24px">📋</span>
          <div>
            <div style="font-weight:700; font-size:16px; color:var(--fg-primary)">입고 로그</div>
            <div class="text-sm muted">날짜별 입고 내역 조회</div>
          </div>
          <svg style="margin-left:auto; color:var(--fg-tertiary)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </a>

      <a href="reprint.html" style="text-decoration:none">
        <div class="card" style="display:flex; align-items:center; gap:14px; padding:18px; margin-bottom:10px; cursor:pointer">
          <span style="font-size:24px">🖨</span>
          <div>
            <div style="font-weight:700; font-size:16px; color:var(--fg-primary)">바코드 재출력</div>
            <div class="text-sm muted">바코드 라벨 재인쇄</div>
          </div>
          <svg style="margin-left:auto; color:var(--fg-tertiary)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/api.js"></script>
  <script src="js/shared.js"></script>
</body>
</html>
