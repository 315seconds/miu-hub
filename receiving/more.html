<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>더보기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page-wrap">
    <div class="page-header">
      <div class="page-header-inner">
        <div class="page-header-left" style="width:38px"></div>
        <div class="page-header-title">더보기</div>
        <div class="page-header-right" style="width:38px"></div>
      </div>
    </div>

    <div class="page-body">
      <a href="logs.html" style="text-decoration:none">
        <div class="card" style="display:flex; align-items:center; gap:14px; padding:18px; margin-bottom:10px; cursor:pointer">
          <span style="font-size:24px">📋</span>
          <div>
            <div style="font-weight:700; font-size:16px; color:var(--fg-primary)">입고 로그</div>
            <div class="text-sm muted">날짜별 입고 내역 조회</div>
          </div>
          <svg style="margin-left:auto; color:var(--fg-tertiary)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </a>

      <a href="price-change.html" style="text-decoration:none">
        <div class="card" style="display:flex; align-items:center; gap:14px; padding:18px; margin-bottom:10px; cursor:pointer">
          <span style="font-size:24px">💰</span>
          <div>
            <div style="font-weight:700; font-size:16px; color:var(--fg-primary)">가격 수정</div>
            <div class="text-sm muted">바코드 스캔으로 가격 변경</div>
          </div>
          <svg style="margin-left:auto; color:var(--fg-tertiary)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </a>

      <a href="reprint.html" style="text-decoration:none">
        <div class="card" style="display:flex; align-items:center; gap:14px; padding:18px; margin-bottom:10px; cursor:pointer">
          <span style="font-size:24px">🖨</span>
          <div>
            <div style="font-weight:700; font-size:16px; color:var(--fg-primary)">바코드 재출력</div>
            <div class="text-sm muted">바코드 라벨 재인쇄</div>
          </div>
          <svg style="margin-left:auto; color:var(--fg-tertiary)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </a>

      <a href="labels.html?daily=1" style="text-decoration:none">
        <div class="card" style="display:flex; align-items:center; gap:14px; padding:18px; margin-bottom:10px; cursor:pointer">
          <span style="font-size:24px">📋</span>
          <div>
            <div style="font-weight:700; font-size:16px; color:var(--fg-primary)">오늘 입고 일괄출력</div>
            <div class="text-sm muted">담당자·행거별로 묶어 한번에 라벨 출력</div>
          </div>
          <svg style="margin-left:auto; color:var(--fg-tertiary)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/api.js"></script>
  <script src="js/shared.js"></script>
</body>
</html>
