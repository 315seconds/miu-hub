<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>신규입고</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="/miu-hub/shared/tokens.css?v=202609210710">
  <link rel="stylesheet" href="/miu-hub/shared/layout.css?v=202609210710">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="stylesheet" href="css/style.css?v=202609210710">
  <!-- auth-migration: 로그인 가드 -->
  <script src="/miu-hub/shared/config.js?v=202609210710"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/miu-hub/shared/supabase-client.js?v=202609210710"></script>
  <script src="/miu-hub/shared/auth-guard.js?v=202609210710"></script>
</head>
<body>
  <div class="page-wrap">
    <header class="miu-header">
      <a href="index.html" class="miu-header-back" aria-label="뒤로">
        <i class="ph-bold ph-caret-left"></i>
      </a>
      <div class="miu-header-title">        <h1 class="miu-header-h1">신규 입고</h1>
      </div>
    </header>

    <div class="page-body">
      <div id="error-msg" class="error" style="display:none"></div>
      <div id="pending-section"></div>

      <div class="new-session-buttons">
        <button class="new-session-btn logistics" data-loc="공동물류">
          <i class="ph-bold ph-warehouse"></i>
          <span class="ns-label">공동물류 세션 만들기</span>
          <span class="ns-sub">지하 1층 · 접두사 A</span>
        </button>
        <button class="new-session-btn online" data-loc="온라인">
          <i class="ph-bold ph-globe"></i>
          <span class="ns-label">온라인 세션 만들기</span>
          <span class="ns-sub">2층 · 접두사 U</span>
        </button>
      </div>
      <style>
        .new-session-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .new-session-btn {
          border: 1.5px solid var(--miu-hairline); background: var(--miu-canvas);
          border-radius: 14px; padding: 20px 16px; cursor: pointer;
          font-family: inherit; text-align: left;
          display: flex; flex-direction: column; gap: 6px;
          transition: all .15s;
        }
        .new-session-btn:hover { border-color: var(--miu-ink); transform: translateY(-1px); }
        .new-session-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .new-session-btn i { font-size: 24px; color: var(--miu-primary); margin-bottom: 4px; }
        .new-session-btn.online i { color: var(--miu-accent-teal); }
        .new-session-btn .ns-label { font-size: 15px; font-weight: 700; color: var(--miu-ink); }
        .new-session-btn .ns-sub { font-size: 11px; color: var(--miu-muted); letter-spacing: 0.2px; }
        @media (max-width: 380px) { .new-session-buttons { grid-template-columns: 1fr; } }
      </style>

      <div id="done-section"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js?v=202609210710"></script>
  <script src="js/api.js?v=202609210710"></script>
  <script src="js/index.js?v=202609210710"></script>
  <script src="js/shared.js?v=202609210710"></script>
</body>
</html>
