<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>입고 관리 · 마켓인유</title>

  <link rel="stylesheet" href="/miu-hub/shared/tokens.css?v=202611130006">
  <link rel="stylesheet" href="/miu-hub/shared/layout.css?v=202611130006">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">

  <!-- auth-migration: 로그인 가드 -->
  <script src="/miu-hub/shared/config.js?v=202611130006"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/miu-hub/shared/supabase-client.js?v=202611130006"></script>
  <script src="/miu-hub/shared/auth-guard.js?v=202611130006"></script>

  <style>
    /* receiving/index 전용 미세 조정 */
    .stats-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stats-2 .miu-stat { padding: 14px 12px; }
    .stats-2 .miu-stat-label { font-size: 10px; }
    .stats-2 .miu-stat-value { font-size: 24px; }
    /* 대기중 강조 */
    .stat-pending-active { color: var(--miu-warning); }
    .stat-value-muted { color: var(--miu-muted); }
    /* 월 누적 비교 (이번 달 vs 지난달 vs 지지난달, 같은 입고일 수까지) */
    .cmp-sub { font-size: 11px; color: var(--miu-muted); margin: 4px 0 2px; }
    .cmp-row {
      display: grid;
      grid-template-columns: 60px 1fr 72px;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }
    .cmp-label { font-size: 12px; font-weight: 600; color: var(--miu-body); line-height: 1.25; }
    .cmp-label small { display: block; font-size: 10px; font-weight: 400; color: var(--miu-muted-soft); }
    .cmp-bar { height: 10px; border-radius: 5px; background: var(--miu-surface-strong); overflow: hidden; }
    .cmp-fill { height: 100%; border-radius: 5px; background: var(--miu-muted-soft); }
    .cmp-row.cur .cmp-fill { background: var(--miu-ink); }
    .cmp-val { text-align: right; font-family: var(--miu-serif); font-size: 18px; line-height: 1.1; color: var(--miu-ink); }
    .cmp-delta { display: block; margin-top: 2px; font-family: var(--miu-sans); font-size: 11px; font-weight: 600; color: var(--miu-muted); }
    .cmp-delta.up { color: var(--miu-success); }
    .cmp-delta.down { color: var(--miu-error); }
  </style>
</head>
<body class="miu-app">

  <header class="miu-header">
    <a href="/miu-hub/" class="miu-header-back" aria-label="허브로">
      <i class="ph-bold ph-caret-left"></i>
    </a>
    <div class="miu-header-title">      <h1 class="miu-header-h1">입고 관리</h1>
    </div>
    <div class="miu-header-actions" id="today-label"
         style="font-size:12px;color:var(--miu-muted);padding-right:4px"></div>
  </header>

  <div class="miu-app-body" style="padding-bottom:40px">

    <!-- 통계 -->
    <div class="miu-section" style="margin-top:20px">
      <div class="stats-2">
        <div class="miu-stat">
          <div class="miu-stat-label">오늘 입고</div>
          <div class="miu-stat-value stat-value-muted" id="stat-today">—</div>
        </div>
        <div class="miu-stat">
          <div class="miu-stat-label">승인 대기 세션</div>
          <div class="miu-stat-value stat-value-muted" id="stat-pending">—</div>
        </div>
      </div>
      <div class="miu-stat" id="month-cmp" style="margin-top:8px" hidden>
        <div class="miu-stat-label" style="margin-bottom:0">월 누적 입고 비교</div>
        <div class="cmp-sub" id="cmp-sub"></div>
        <div id="cmp-rows"></div>
      </div>
    </div>

    <!-- 01. 입고 -->
    <div class="miu-section">
      <div class="miu-section-head">
        <span class="miu-section-num">01</span>
        <span class="miu-section-label">입고</span>
        <span class="miu-section-divider"></span>
      </div>
      <div class="miu-tile-grid">
        <a href="session-list.html" class="miu-tile miu-tile-wide" style="--tile-accent:#4a6b8a">
          <div class="miu-tile-icon"><i class="ph-bold ph-package"></i></div>
          <div class="miu-tile-body">
            <div class="miu-tile-title">
              신규입고
              <span id="pending-badge" class="miu-chip warn"
                    style="display:none;margin-left:6px;font-size:10px;vertical-align:middle"></span>
            </div>
            <div class="miu-tile-desc">행거별 상품 등록 및 세션 참여</div>
          </div>
          <span class="miu-tile-arrow"><i class="ph-bold ph-caret-right"></i></span>
        </a>

        <a href="approve.html" class="miu-tile miu-tile-wide" style="--tile-accent:#6b8e6b">
          <div class="miu-tile-icon"><i class="ph-bold ph-check-circle"></i></div>
          <div class="miu-tile-body">
            <div class="miu-tile-title">입고 승인</div>
            <div class="miu-tile-desc">대기 중인 세션 확인 및 승인</div>
          </div>
          <span class="miu-tile-arrow"><i class="ph-bold ph-caret-right"></i></span>
        </a>
      </div>
    </div>

    <!-- 02. 조회 -->
    <div class="miu-section">
      <div class="miu-section-head">
        <span class="miu-section-num">02</span>
        <span class="miu-section-label">조회</span>
        <span class="miu-section-divider"></span>
      </div>
      <div class="miu-tile-grid">
        <a href="logs.html" class="miu-tile miu-tile-wide" style="--tile-accent:#3c4e75">
          <div class="miu-tile-icon"><i class="ph-bold ph-clipboard-text"></i></div>
          <div class="miu-tile-body">
            <div class="miu-tile-title">입고 로그</div>
            <div class="miu-tile-desc">날짜별 입고 기록 및 요약</div>
          </div>
          <span class="miu-tile-arrow"><i class="ph-bold ph-caret-right"></i></span>
        </a>
      </div>
    </div>

    <!-- 03. 작업 -->
    <div class="miu-section">
      <div class="miu-section-head">
        <span class="miu-section-num">03</span>
        <span class="miu-section-label">작업</span>
        <span class="miu-section-divider"></span>
      </div>
      <div class="miu-tile-grid">
        <a href="labels.html?daily=1" class="miu-tile miu-tile-wide" style="--tile-accent:#6c6a64">
          <div class="miu-tile-icon"><i class="ph-bold ph-printer"></i></div>
          <div class="miu-tile-body">
            <div class="miu-tile-title">오늘 입고 일괄출력</div>
            <div class="miu-tile-desc">담당자·행거별로 묶어 한번에 라벨 출력</div>
          </div>
          <span class="miu-tile-arrow"><i class="ph-bold ph-caret-right"></i></span>
        </a>
      </div>
    </div>

  </div>

  <!-- 기존 receiving JS 스택 유지 (통계 로드 + bottom-nav 자동 삽입) -->
  <script src="js/supabase-client.js?v=202611130006"></script>
  <script src="js/api.js?v=202611130006"></script>
  <script src="js/shared.js?v=202611130006"></script>
  <script>
    document.getElementById('today-label').textContent = getTodayLabel();

    async function loadStats() {
      const today = new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);

      const [pendingRes, todayRes] = await Promise.allSettled([
        sb.from("inventory_sessions").select("status", { count: "exact", head: true }).eq("status", "pending"),
        sb.from("inventory_sessions").select("inventory_hangers(inventory_items(id))").eq("session_date", today).in("status", ["approved", "processed"]),
      ]);

      if (pendingRes.status === "fulfilled" && !pendingRes.value.error) {
        const count = pendingRes.value.count || 0;
        const el = document.getElementById('stat-pending');
        el.textContent = count;
        el.classList.remove('stat-value-muted');
        if (count > 0) {
          el.classList.add('stat-pending-active');
          const badge = document.getElementById('pending-badge');
          badge.textContent = count + '건 대기';
          badge.style.display = '';
        }
      }

      if (todayRes.status === "fulfilled" && !todayRes.value.error) {
        const total = (todayRes.value.data || []).flatMap(s =>
          (s.inventory_hangers || []).flatMap(h => h.inventory_items || [])
        ).length;
        const el = document.getElementById('stat-today');
        el.textContent = total;
        el.classList.remove('stat-value-muted');
      }
    }

    function fmtMD(iso) {
      const p = iso.split('-');
      return Number(p[1]) + '/' + Number(p[2]);
    }

    function cmpEl(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    // RPC receiving_month_compare: 최근 달부터 3행, 세 달 모두 "첫 k입고일"까지 누적
    async function loadMonthCompare() {
      const { data, error } = await sb.rpc('receiving_month_compare');
      if (error || !data || data.length !== 3) {
        console.warn('월 누적 비교 로드 실패:', error && error.message);
        return;
      }
      const cur = data[0];
      const k = cur.business_days;
      document.getElementById('month-cmp').hidden = false;
      const sub = document.getElementById('cmp-sub');
      const rows = document.getElementById('cmp-rows');
      rows.textContent = '';
      if (k === 0) {
        sub.textContent = '이번 달 입고 기록이 아직 없어요';
        return;
      }
      sub.textContent = '이번 달 평일 입고 기준 ' + k + '일째 누적 · 오늘 포함' + (k < 3 ? ' · 증감률은 3일째부터' : '');
      const max = Math.max(data[0].total, data[1].total, data[2].total, 1);
      ['이번 달', '지난달', '지지난달'].forEach((label, i) => {
        const r = data[i];
        const row = cmpEl('div', i === 0 ? 'cmp-row cur' : 'cmp-row');
        const lab = cmpEl('div', 'cmp-label', label);
        lab.appendChild(cmpEl('small', '', r.cutoff_date ? fmtMD(r.cutoff_date) + '까지' : ''));
        const bar = cmpEl('div', 'cmp-bar');
        const fill = cmpEl('div', 'cmp-fill');
        fill.style.width = (r.total / max * 100) + '%';
        bar.appendChild(fill);
        const val = cmpEl('div', 'cmp-val', r.total.toLocaleString('ko-KR'));
        if (i > 0 && k >= 3 && r.total > 0) {
          const pct = Math.round((cur.total - r.total) / r.total * 100);
          const cls = pct > 0 ? 'up' : pct < 0 ? 'down' : '';
          const sign = pct > 0 ? '+' : pct < 0 ? '−' : '';
          val.appendChild(cmpEl('span', 'cmp-delta ' + cls, '이번 달 ' + sign + Math.abs(pct) + '%'));
        }
        row.append(lab, bar, val);
        rows.appendChild(row);
      });
    }

    loadStats();
    loadMonthCompare();
  </script>
</body>
</html>
