<script>
function appAlert(msg) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(20,20,19,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box';
    overlay.innerHTML = `<div style="background:var(--miu-canvas);border-radius:16px;padding:24px 20px;max-width:340px;width:100%;box-shadow:0 12px 32px rgba(20,20,19,.2);border:1px solid var(--miu-hairline)"><div style="color:var(--miu-ink);font-size:15px;line-height:1.6;white-space:pre-line;margin-bottom:20px">${String(msg).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div><button id="_modal-ok" style="width:100%;padding:12px;background:var(--miu-primary);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:600;cursor:pointer">확인</button></div>`;
    document.body.appendChild(overlay);
    const close = () => { overlay.remove(); resolve(); };
    overlay.querySelector('#_modal-ok').addEventListener('click', close);
    overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  });
}
</script>

<style>
/* ── 툴바 (미유 톤) ── */
.labels-toolbar {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; flex-wrap: wrap;
  background: var(--miu-canvas); border-bottom: 1px solid var(--miu-hairline);
  position: sticky; top: 0; z-index: 10;
}
.labels-sub {
  font-size: 12px; color: var(--miu-muted);
  padding: 0 16px 12px; background: var(--miu-canvas);
  border-bottom: 1px solid var(--miu-hairline);
  position: sticky; top: 57px; z-index: 9;
}
.tb-btn {
  border-radius: 8px; padding: 8px 14px; font-size: 13px;
  font-weight: 600; cursor: pointer; white-space: nowrap;
  border: 1px solid var(--miu-hairline); background: var(--miu-canvas);
  color: var(--miu-ink); font-family: inherit;
}
.tb-btn:hover:not(:disabled) { background: var(--miu-surface-soft); }
.tb-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.tb-btn.tb-btn--team { color: var(--miu-muted); }
.tb-btn.tb-btn--team.active {
  background: var(--miu-primary); color: #fff; border-color: var(--miu-primary);
}
.tb-btn.tb-btn--primary {
  background: var(--miu-primary); color: #fff; border-color: var(--miu-primary);
}
.tb-btn.tb-btn--primary:hover:not(:disabled) { filter: brightness(0.95); }
.tb-spacer { flex: 1; }

.daily-controls { display: none; align-items: center; gap: 8px; flex-wrap: wrap; }
.daily-controls input[type="date"] {
  background: var(--miu-canvas); color: var(--miu-ink);
  border: 1px solid var(--miu-hairline); border-radius: 8px;
  padding: 7px 10px; font-size: 13px; font-family: inherit;
}
.daily-toggle {
  display: flex; align-items: center; gap: 4px;
  font-size: 12px; color: var(--miu-muted); white-space: nowrap;
}

.not-found-box {
  display: none;
  background: #fef2f2; color: #991b1b;
  border: 1px solid #fca5a5; border-radius: 10px;
  padding: 12px 16px; margin: 12px 16px 0;
}
.not-found-box strong { display: block; margin-bottom: 6px; font-weight: 700; }
.not-found-list { font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.8; }

/* ── 라벨 (인쇄 원본 유지) ── */
.label-grid {
  display: flex; flex-wrap: wrap; gap: 12px;
  padding: 20px; justify-content: flex-start;
  background: var(--miu-canvas);
}

.label-separator {
  width: 4cm; height: 3cm;
  background: var(--miu-ink); border: 2px solid var(--miu-muted); border-radius: 2px;
  display: flex; align-items: center; justify-content: center;
  page-break-inside: avoid; break-inside: avoid;
}
.label-separator .sep-num {
  font-size: 52pt; font-weight: 900; color: var(--miu-on-dark); line-height: 1;
}
.label-separator .sep-num.sep-num-op {
  font-size: 13pt; line-height: 1.3; padding: 4px; text-align: center;
}
@media screen {
  .label-separator {
    transform: scale(1.9); transform-origin: top left;
    margin-right: calc(4cm * 0.9); margin-bottom: calc(3cm * 0.9);
  }
}

.label {
  width: 4cm; height: 3cm;
  background: #fff; border: 1px solid #bbb; border-radius: 2px;
  padding: 2.5px 4px 2px 4px;
  display: flex; flex-direction: column;
  overflow: hidden; page-break-inside: avoid; break-inside: avoid;
}
@media screen {
  .label-grid { gap: 16px; padding: 24px; }
  .label {
    transform: scale(1.9); transform-origin: top left;
    margin-right: calc(4cm * 0.9); margin-bottom: calc(3cm * 0.9);
  }
}

.label-name {
  font-size: 6.5pt; font-weight: 700; color: #111;
  text-align: center; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
  line-height: 1.2; flex-shrink: 0; padding-top: 1.5px;
}
.label-price-wrap {
  flex: 1; display: flex; align-items: center; justify-content: center;
}
.label-price {
  font-size: 20pt; font-weight: 900; color: #000;
  text-align: center; line-height: 1.05; letter-spacing: -0.5px;
}
.label-bottom {
  flex-shrink: 0; height: 1.35cm;
  display: flex; flex-direction: column;
}
.label-barcode {
  flex: 1; display: flex; align-items: center; overflow: hidden; min-height: 0;
}
.label-barcode svg { width: 100%; height: 100%; display: block; }
.label-barcode-num {
  font-size: 7pt; font-weight: 900; color: #000;
  text-align: center; font-family: 'Courier New', monospace;
  letter-spacing: 1px; flex-shrink: 0; line-height: 1.2; padding-bottom: 2px;
}

@media print {
  .miu-header, .labels-toolbar, .labels-sub, .not-found-box { display: none !important; }
  .label-grid { padding: 0; gap: 0; }
  .label, .label-separator { transform: none !important; margin: 0 !important; }
}
</style>
