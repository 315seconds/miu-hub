<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>캘린더 · 마켓인유</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg:        #FAFAFA;
  --surface:   #FFFFFF;
  --ink:       #171717;
  --muted:     #9CA3AF;
  --line:      #E5E7EB;
  --brand:     #f54e00;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 24px;
}

body {
  background: var(--bg);
  font-family: 'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  color: var(--ink);
  max-width: 480px;
  margin: 0 auto;
}

/* ── 상단 헤더 (뒤로가기) ── */
.topbar {
  padding: 14px 20px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.back-btn {
  font-size: 22px;
  text-decoration: none;
  color: var(--ink);
  line-height: 1;
  padding: 4px;
}
.brand-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--brand);
  letter-spacing: 1.8px;
  text-transform: uppercase;
}

/* ── 월 헤더 ── */
.month-header {
  padding: 8px 20px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.month-year {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -1px;
  color: var(--ink);
}
.month-nav {
  display: flex;
  gap: 6px;
}
.nav-btn {
  width: 36px; height: 36px;
  border: 1.5px solid var(--line);
  border-radius: 50%;
  background: var(--surface);
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .1s;
  color: var(--ink);
}
.nav-btn:active { background: var(--line); }

/* ── 일러스트 영역 ── */
.illo-wrap {
  margin: 0 20px 16px;
  border-radius: var(--r-xl);
  overflow: hidden;
  background: #1a1a1a;
  position: relative;
  aspect-ratio: 3 / 2;
}
.illo-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  opacity: 0;
  transition: opacity .3s;
}
.illo-img.loaded { opacity: 1; }
.illo-fallback {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: rgba(255,255,255,0.3);
  font-size: 13px;
  text-align: center;
}
.illo-fallback-icon { font-size: 36px; opacity: 0.5; }
.illo-badge {
  position: absolute;
  bottom: 14px;
  left: 16px;
  right: 16px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
}
.illo-badge-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.6);
}
.illo-badge-tag {
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 20px;
  padding: 4px 10px;
}

/* ── 범례 ── */
.legend-wrap {
  padding: 0 20px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--muted);
  font-weight: 500;
}
.legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

/* ── 캘린더 그리드 ── */
.cal-outer {
  margin: 0 12px 32px;
  background: var(--surface);
  border-radius: var(--r-xl);
  overflow: hidden;
  border: 1.5px solid var(--line);
}

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}

.cal-dow {
  text-align: center;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
  padding: 10px 2px 8px;
  color: var(--muted);
  border-bottom: 1.5px solid var(--line);
}
.cal-dow.sun { color: #ef4444; }
.cal-dow.sat { color: #3b82f6; }

.cal-cell {
  height: 72px;
  padding: 6px 3px 4px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 2px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  transition: background .1s;
  position: relative;
  overflow: hidden;
}
.cal-cell:nth-child(7n) { border-right: none; }
.cal-cell:active { background: #F3F4F6; }
.cal-cell.empty { background: #F9FAFB; cursor: default; }

.cal-day-num {
  font-size: 12px;
  font-weight: 600;
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  margin: 0 auto 1px;
  color: var(--ink);
  flex-shrink: 0;
}
.cal-cell.sun .cal-day-num { color: #ef4444; }
.cal-cell.sat .cal-day-num { color: #3b82f6; }
.cal-cell.today .cal-day-num {
  background: var(--brand);
  color: #fff;
}
.cal-cell.today.sun .cal-day-num,
.cal-cell.today.sat .cal-day-num { color: #fff; }

.holiday-name {
  font-size: 8px;
  font-weight: 600;
  color: #ef4444;
  text-align: center;
  line-height: 1.2;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  padding: 0 2px;
}

.event-chip {
  font-size: 9px;
  font-weight: 600;
  color: #fff;
  border-radius: 3px;
  padding: 1px 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.4;
}
.event-more {
  font-size: 9px;
  color: var(--muted);
  text-align: center;
}

/* ── 공통 모달 ── */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 100;
  align-items: flex-end;
  justify-content: center;
}
.modal {
  background: var(--surface);
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  width: 100%;
  max-width: 480px;
  padding: 8px 20px 48px;
  max-height: 85dvh;
  overflow-y: auto;
}
.modal-pill {
  width: 36px; height: 4px;
  background: var(--line);
  border-radius: 2px;
  margin: 10px auto 18px;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.modal-title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
.modal-close {
  background: none; border: none; font-size: 22px; cursor: pointer;
  color: var(--muted); width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
}
.modal-close:active { background: var(--line); }

/* ── 날짜 상세 모달 ── */
.day-date-label {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
  margin-bottom: 16px;
}
.day-empty {
  color: var(--muted);
  font-size: 14px;
  padding: 20px 0;
  text-align: center;
}
.day-event-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}
.day-event-item:last-child { border-bottom: none; }
.day-event-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 4px;
}
.day-event-body { flex: 1; min-width: 0; }
.day-event-title { font-size: 15px; font-weight: 600; }
.day-event-note  { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
.day-event-type  {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  margin-top: 5px;
  padding: 2px 7px;
  border-radius: 20px;
  background: var(--line);
  color: var(--muted);
}
.day-event-actions { display: flex; gap: 4px; flex-shrink: 0; }
.btn-icon {
  background: none;
  border: 1.5px solid var(--line);
  border-radius: var(--r-sm);
  padding: 6px 9px;
  font-size: 13px;
  cursor: pointer;
}
.btn-icon:active { background: var(--line); }

.btn-add {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  background: var(--ink);
  color: #fff;
  border: none;
  border-radius: var(--r-lg);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: 0.2px;
}
.btn-add:active { opacity: .8; }

/* ── 폼 모달 ── */
.form-group { margin-bottom: 16px; }
.form-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-bottom: 7px;
  display: block;
}
.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--line);
  border-radius: var(--r-md);
  font-size: 15px;
  font-family: inherit;
  color: var(--ink);
  background: var(--surface);
  outline: none;
  transition: border-color .15s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--ink);
}
.form-textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
.btn-save {
  width: 100%;
  padding: 15px;
  background: var(--brand);
  color: #fff;
  border: none;
  border-radius: var(--r-lg);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  margin-top: 4px;
  letter-spacing: 0.2px;
}
.btn-save:active { opacity: .85; }

/* ── PIN 모달 ── */
.pin-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.pin-modal {
  background: var(--surface);
  border-radius: var(--r-xl);
  padding: 32px 24px 24px;
  width: 100%;
  max-width: 300px;
  text-align: center;
}
.pin-title    { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
.pin-subtitle { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
.pin-dots     { display: flex; justify-content: center; gap: 12px; margin-bottom: 8px; }
.pin-dot {
  width: 11px; height: 11px;
  border-radius: 50%;
  border: 2px solid var(--line);
  background: transparent;
  transition: background .12s, border-color .12s;
}
.pin-dot.filled { background: var(--ink); border-color: var(--ink); }
.pin-error { font-size: 12px; color: #ef4444; height: 20px; margin-bottom: 14px; }
.pin-pad   { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 14px; }
.pin-key {
  background: var(--bg);
  border: 1.5px solid var(--line);
  border-radius: var(--r-md);
  height: 52px;
  font-size: 20px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  color: var(--ink);
  transition: background .1s;
}
.pin-key:active  { background: var(--line); }
.pin-key-empty   { border: none !important; background: transparent !important; cursor: default; }
.pin-key-del     { font-size: 16px; }
.pin-cancel {
  width: 100%;
  background: none;
  border: 1.5px solid var(--line);
  border-radius: var(--r-md);
  padding: 12px;
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  color: var(--muted);
}
.pin-cancel:active { background: var(--bg); }
</style>
</head>
<body>

<div class="topbar">
  <a href="../" class="back-btn">‹</a>
  <span class="brand-label">Market in U</span>
  <div style="width:30px"></div>
</div>

<!-- 월 헤더 -->
<div class="month-header">
  <div class="month-year" id="cal-year"></div>
  <div class="month-nav">
    <button class="nav-btn" onclick="prevMonth()">‹</button>
    <button class="nav-btn" onclick="nextMonth()">›</button>
  </div>
</div>

<!-- 일러스트 -->
<div class="illo-wrap">
  <img class="illo-img" id="illo-img" src="" alt=""
       onload="this.classList.add('loaded')"
       onerror="this.style.display='none'">
  <div class="illo-fallback" id="illo-fallback">
    <div class="illo-fallback-icon">🧥</div>
    <div>일러스트 준비 중</div>
  </div>
  <div class="illo-badge">
    <span class="illo-badge-label">Market in U</span>
    <span class="illo-badge-tag" id="illo-badge-tag"></span>
  </div>
</div>

<!-- 범례 -->
<div class="legend-wrap" id="legend"></div>

<!-- 캘린더 -->
<div class="cal-outer">
  <div class="cal-grid" id="cal-grid"></div>
</div>

<!-- 날짜 상세 모달 -->
<div class="modal-overlay" id="day-modal-overlay" onclick="if(event.target===this)closeDayModal()">
  <div class="modal">
    <div class="modal-pill"></div>
    <div class="modal-header">
      <span class="modal-title" id="day-modal-title"></span>
      <button class="modal-close" onclick="closeDayModal()">×</button>
    </div>
    <div id="day-event-list"></div>
    <button class="btn-add" id="day-add-btn">+ 일정 추가 (관리자)</button>
  </div>
</div>

<!-- 이벤트 폼 모달 -->
<div class="modal-overlay" id="form-modal-overlay" onclick="if(event.target===this)closeFormModal()">
  <div class="modal">
    <div class="modal-pill"></div>
    <div class="modal-header">
      <span class="modal-title" id="form-modal-title">일정 추가</span>
      <button class="modal-close" onclick="closeFormModal()">×</button>
    </div>
    <div class="form-group">
      <label class="form-label">날짜</label>
      <input type="date" id="form-date" class="form-input" readonly>
    </div>
    <div class="form-group">
      <label class="form-label">제목</label>
      <input type="text" id="form-title" class="form-input" placeholder="예: 성수 팝업 셋업">
    </div>
    <div class="form-group">
      <label class="form-label">구분</label>
      <select id="form-type" class="form-select"></select>
    </div>
    <div class="form-group">
      <label class="form-label">메모 (선택)</label>
      <textarea id="form-note" class="form-textarea" placeholder="추가 내용이 있으면 입력하세요"></textarea>
    </div>
    <button class="btn-save" id="form-save-btn">저장</button>
  </div>
</div>

<!-- PIN 모달 -->
<div class="pin-overlay" id="pin-overlay" onclick="if(event.target===this)closePinModal()">
  <div class="pin-modal">
    <div class="pin-title">관리자 인증</div>
    <div class="pin-subtitle">PIN 4자리를 입력해주세요</div>
    <div class="pin-dots" id="pin-dots">
      <span class="pin-dot"></span><span class="pin-dot"></span>
      <span class="pin-dot"></span><span class="pin-dot"></span>
    </div>
    <div class="pin-error" id="pin-error"></div>
    <div class="pin-pad">
      <button class="pin-key" onclick="pinPress('1')">1</button>
      <button class="pin-key" onclick="pinPress('2')">2</button>
      <button class="pin-key" onclick="pinPress('3')">3</button>
      <button class="pin-key" onclick="pinPress('4')">4</button>
      <button class="pin-key" onclick="pinPress('5')">5</button>
      <button class="pin-key" onclick="pinPress('6')">6</button>
      <button class="pin-key" onclick="pinPress('7')">7</button>
      <button class="pin-key" onclick="pinPress('8')">8</button>
      <button class="pin-key" onclick="pinPress('9')">9</button>
      <button class="pin-key pin-key-empty"></button>
      <button class="pin-key" onclick="pinPress('0')">0</button>
      <button class="pin-key pin-key-del" onclick="pinDel()">⌫</button>
    </div>
    <button class="pin-cancel" onclick="closePinModal()">취소</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script>
  // 범례
  const legendEl = document.getElementById('legend');
  EVENT_TYPES.forEach(t => {
    legendEl.innerHTML += `<div class="legend-item"><span class="legend-dot" style="background:${t.color}"></span>${t.key}</div>`;
  });

  // 초기화
  const now = new Date();
  renderCalendar(now.getFullYear(), now.getMonth() + 1);
</script>
</body>
</html>
