<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>사진 업로드 (관리자) — 빈티지 아카이브 평가</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<style>
:root {
  --primary: #f54e00;
  --ink: #171719;
  --muted: #989BA2;
  --hairline: rgba(112,115,124,0.22);
  --canvas: #F7F7F8;
  --surface-card: #FFFFFF;
  --surface-strong: #F4F4F5;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--canvas);
  color: var(--ink);
  font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  min-height: 100dvh;
  padding: 20px;
}
h1 { font-size: 18px; margin-bottom: 4px; }
.sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
.drop {
  border: 2px dashed var(--hairline);
  border-radius: 14px;
  padding: 32px 16px;
  text-align: center;
  background: var(--surface-card);
  margin-bottom: 16px;
}
input[type=file] { width: 100%; }
.upload-btn {
  width: 100%;
  padding: 13px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 16px;
}
.upload-btn:disabled { background: var(--muted); }
.progress { font-size: 13px; color: var(--muted); margin-bottom: 16px; white-space: pre-line; }
.thumbs {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
  gap: 6px;
}
.thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; }
.count { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
</style>
</head>
<body>

<h1>사진 업로드</h1>
<div class="sub">직원 평가 화면에 바로 반영됩니다. 업로드 시 자동으로 리사이즈/압축됩니다.</div>

<div class="drop">
  <input type="file" id="file-input" accept="image/*" multiple>
</div>
<button class="upload-btn" id="upload-btn" onclick="startUpload()">업로드</button>
<div class="progress" id="progress"></div>

<div class="count" id="existing-count"></div>
<div class="thumbs" id="thumbs"></div>

<script src="js/admin.js"></script>
</body>
</html>
