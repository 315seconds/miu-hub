<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>빈티지 아카이브 평가 — 마켓인유</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<style>
:root {
  --primary:        #f54e00;
  --primary-active: #d04200;
  --ink:            #171719;
  --body:           rgba(70,71,76,0.86);
  --muted:          #989BA2;
  --hairline:       rgba(112,115,124,0.22);
  --canvas:         #F7F7F8;
  --surface-card:   #FFFFFF;
  --surface-strong: #F4F4F5;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--canvas);
  color: var(--ink);
  font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}

.header {
  background: var(--surface-card);
  border-bottom: 1px solid var(--hairline);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 10;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.header-home {
  font-size: 18px;
  text-decoration: none;
  color: var(--ink);
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 8px;
}
.header-home:active { background: var(--surface-strong); }
.header-title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
.header-right { display: flex; align-items: center; gap: 8px; }
.header-refresh {
  border: none;
  background: none;
  font-size: 17px;
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 8px;
  color: var(--ink);
}
.header-refresh:active { background: var(--surface-strong); }
.header-refresh.spinning { animation: header-refresh-spin 0.6s linear; }
@keyframes header-refresh-spin { to { transform: rotate(360deg); } }
.header-user {
  font-size: 13px;
  color: var(--muted);
  border: 1px solid var(--hairline);
  border-radius: 20px;
  padding: 6px 12px;
  background: var(--surface-strong);
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 14px;
}
.card {
  background: var(--surface-card);
  border: 1px solid var(--hairline);
  border-radius: 14px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.card-img-wrap { position: relative; aspect-ratio: 1; background: var(--surface-strong); }
.card-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-done {
  position: absolute;
  top: 6px;
  right: 6px;
  background: rgba(23,23,25,0.65);
  color: #fff;
  font-size: 11px;
  border-radius: 10px;
  padding: 2px 7px;
}
.card-meta { padding: 8px 10px 10px; display: flex; align-items: baseline; justify-content: space-between; }
.card-score { font-size: 16px; font-weight: 700; color: var(--primary); }
.card-score.none { color: var(--muted); font-weight: 500; font-size: 13px; }
.card-count { font-size: 11px; color: var(--muted); }

.empty { padding: 60px 20px; text-align: center; color: var(--muted); font-size: 14px; }

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  align-items: flex-end;
}
.overlay.open { display: flex; }
.sheet {
  background: var(--surface-card);
  width: 100%;
  max-height: 92dvh;
  border-radius: 20px 20px 0 0;
  overflow-y: auto;
  padding: 16px 20px 28px;
}
.sheet-header {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  margin-bottom: 14px;
}
.sheet-close {
  width: 36px; height: 4px;
  background: var(--hairline);
  border-radius: 2px;
}
.sheet-back {
  position: absolute;
  left: 0;
  top: -4px;
  border: none;
  background: none;
  color: var(--primary);
  font-size: 14px;
  font-weight: 600;
  padding: 8px 4px;
}
.sheet img { width: 100%; border-radius: 12px; display: block; margin-bottom: 12px; }
.sheet-stats { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
.sheet-stats b { color: var(--ink); font-size: 15px; }

.score-row { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.score-btn {
  flex: 1 1 auto;
  min-width: 28px;
  padding: 8px 0;
  text-align: center;
  border: 1px solid var(--hairline);
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  background: var(--surface-strong);
}
.score-btn.selected { background: var(--primary); border-color: var(--primary); color: #fff; }

textarea {
  width: 100%;
  border: 1px solid var(--hairline);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 14px;
  font-family: inherit;
  resize: vertical;
  min-height: 64px;
  margin-bottom: 12px;
}
.submit-btn {
  width: 100%;
  padding: 13px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
}
.submit-btn:disabled { background: var(--muted); }

.rating-list { margin-top: 18px; border-top: 1px solid var(--hairline); padding-top: 14px; }
.rating-item { padding: 10px 0; border-bottom: 1px solid var(--hairline); }
.rating-item:last-child { border-bottom: none; }
.rating-item-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 3px; }
.rating-item-name { font-weight: 600; }
.rating-item-score { color: var(--primary); font-weight: 700; }
.rating-item-feedback { font-size: 13px; color: var(--body); line-height: 1.4; }

.name-gate {
  position: fixed; inset: 0; background: var(--canvas);
  z-index: 200; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 24px;
}
.name-gate h2 { font-size: 18px; margin-bottom: 16px; }
.name-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 360px; }
.name-btn {
  padding: 12px 4px;
  border: 1px solid var(--hairline);
  border-radius: 10px;
  background: var(--surface-card);
  font-size: 14px;
  font-weight: 600;
}
</style>
</head>
<body>

<div class="name-gate" id="name-gate">
  <h2>누구세요?</h2>
  <div class="name-grid" id="name-grid"></div>
</div>

<div class="header">
  <div class="header-left">
    <a href="../" class="header-home" title="허브 홈으로">🏠</a>
    <div class="header-title">빈티지 아카이브 평가</div>
  </div>
  <div class="header-right">
    <button class="header-refresh" id="refresh-btn" onclick="refreshData()" title="새로고침">🔄</button>
    <div class="header-user" id="current-user" onclick="changeUser()"></div>
  </div>
</div>

<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none;">등록된 사진이 없습니다.</div>

<div class="overlay" id="overlay" onclick="if(event.target===this) closeSheet()">
  <div class="sheet">
    <div class="sheet-header">
      <button class="sheet-back" onclick="closeSheet()">← 목록으로</button>
      <div class="sheet-close"></div>
    </div>
    <img id="sheet-img" src="" alt="">
    <div class="sheet-stats">평균 <b id="sheet-avg">-</b>점 · <span id="sheet-count">0</span>명 평가</div>
    <div class="score-row" id="score-row"></div>
    <textarea id="feedback-input" placeholder="의견을 남겨주세요 (선택)"></textarea>
    <button class="submit-btn" id="submit-btn" onclick="submitRating()">제출</button>
    <div class="rating-list" id="rating-list"></div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
