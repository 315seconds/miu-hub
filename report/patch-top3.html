async function runPatch() {
  const btn = document.getElementById('run-btn');
  const log = document.getElementById('log');
  const doneBtn = document.getElementById('done-btn');

  btn.disabled = true;
  btn.innerHTML = '<div class="miu-spinner" style="width:16px;height:16px;border-width:2px"></div> 진행 중...';
  log.style.display = 'block';

  let ok = 0, fail = 0, skip = 0;

  for (let i = 0; i < RECORDS.length; i++) {
    const r = RECORDS[i];
    const tag = `[${i+1}/${RECORDS.length}] ${r.report_type === 'main' ? r.start_date.slice(0,7) : r.store} (${r.start_date}~${r.end_date})`;
    log.textContent += `${tag} ...`;
    log.scrollTop = log.scrollHeight;

    const { data, error } = await sb
      .from('sales_reports')
      .update({ top_categories: r.top_categories })
      .eq('store', r.store)
      .eq('report_type', r.report_type)
      .eq('start_date', r.start_date)
      .eq('end_date', r.end_date)
      .select('id');

    if (error) {
      log.textContent += ` 실패: ${error.message}\n`;
      fail++;
    } else if (!data || data.length === 0) {
      log.textContent += ` 레코드 없음 (migrate.html 먼저 실행 필요)\n`;
      skip++;
    } else {
      log.textContent += ` 완료\n`;
      ok++;
    }
    log.scrollTop = log.scrollHeight;
  }

  log.textContent += `\n완료: 성공 ${ok}건 / 실패 ${fail}건 / 레코드없음 ${skip}건`;
  btn.innerHTML = '<i class="ph-bold ph-check"></i> 완료';
  doneBtn.style.display = 'block';
}
