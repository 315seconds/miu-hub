async function runMigration() {
  const btn = document.getElementById('run-btn');
  const log = document.getElementById('log');
  const doneBtn = document.getElementById('done-btn');

  btn.disabled = true;
  btn.innerHTML = '<div class="miu-spinner" style="width:16px;height:16px;border-width:2px"></div> 진행 중...';
  log.style.display = 'block';

  let ok = 0, fail = 0;

  for (let i = 0; i < RECORDS.length; i++) {
    const r = RECORDS[i];
    const tag = `[${i+1}/${RECORDS.length}] ${r.report_type === 'main' ? r.label : r.store} (${r.start_date}~${r.end_date})`;
    log.textContent += `${tag} ...`;
    log.scrollTop = log.scrollHeight;

    const { error } = await sb
      .from('sales_reports')
      .upsert(r, { onConflict: 'store,report_type,start_date,end_date' });

    if (error) {
      log.textContent += ` 실패: ${error.message}\n`;
      fail++;
    } else {
      log.textContent += ` 완료\n`;
      ok++;
    }
    log.scrollTop = log.scrollHeight;
  }

  log.textContent += `\n완료: 성공 ${ok}건 / 실패 ${fail}건`;
  btn.innerHTML = '<i class="ph-bold ph-check"></i> 완료';
  doneBtn.style.display = 'block';
}
