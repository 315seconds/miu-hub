<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>매장 현황판 — 마켓인유</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* WDS 기반 메인 팔레트 */
      --canvas:       #F7F7F8;
      --surface-soft: #FAFAFA;
      --surface-card: #F4F4F5;
      --surface-strong:#EBEBEC;

      /* 사이드바 다크 (유지) */
      --tile:         #0f1923;
      --tile-elevated:#1a2633;
      --on-dark:      #ffffff;
      --muted-dk:     rgba(255,255,255,0.48);

      /* WDS 텍스트 */
      --ink:          #171719;
      --ink-strong:   #171719;
      --body:         rgba(70,71,76,0.86);
      --muted:        #989BA2;
      --muted-soft:   #C2C4C8;
      --hairline:     rgba(112,115,124,0.22);
      --hairline-soft:rgba(112,115,124,0.12);

      /* 차트/통계 강조색 (유지) */
      --pink:         #ff4d8b;
      --teal:         #1a3a3a;
      --lavender:     #b8a4ed;
      --peach:        #ffb084;
      --ochre:        #e8b94a;
      --mint:         #a4d4c5;
      --coral:        #ff6b5a;

      /* WDS 시맨틱 */
      --success:      #00BF40;
      --warning:      #FF5E00;
      --error:        #E52222;

      /* Radius */
      --r-xs:   6px;
      --r-sm:   8px;
      --r-md:   12px;
      --r-lg:   16px;
      --r-xl:   24px;
      --r-pill: 9999px;
    }

    body {
      font-family: 'Pretendard Variable', 'Pretendard', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--canvas);
      color: var(--ink);
      display: flex;
      height: 100vh;
      overflow: hidden;
      font-size: 16px;
      line-height: 1.55;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 220px;
      min-width: 220px;
      background: var(--tile);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-logo {
      padding: 20px 18px 16px;
      font-size: 14px;
      font-weight: 600;
      color: var(--on-dark);
      letter-spacing: -0.1px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .sidebar-logo-mark {
      width: 24px; height: 24px;
      background: var(--peach);
      border-radius: 6px;
      flex-shrink: 0;
    }

    .sidebar-section {
      padding: 12px 10px 4px;
    }
    .sidebar-section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.2px;
      color: var(--muted-dk);
      text-transform: uppercase;
      padding: 0 8px;
      margin-bottom: 3px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: var(--r-sm);
      font-size: 13px;
      font-weight: 400;
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      cursor: pointer;
      transition: background .12s, color .12s;
      margin-bottom: 1px;
    }
    .nav-item:hover  { background: rgba(255,255,255,0.06); color: var(--on-dark); }
    .nav-item.active { background: rgba(255,255,255,0.11); color: var(--on-dark); font-weight: 500; }
    .nav-item svg    { width: 13px; height: 13px; flex-shrink: 0; opacity: .65; }
    .nav-item.active svg { opacity: 1; }
    .nav-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.2); flex-shrink: 0; }
    .nav-item.active .nav-dot { background: var(--peach); }

    .sidebar-footer {
      margin-top: auto;
      padding: 14px 18px;
      font-size: 11px;
      color: var(--muted-dk);
      border-top: 1px solid rgba(255,255,255,0.07);
      line-height: 1.6;
      white-space: pre-line;
    }

    /* ── Main ── */
    #main {
      flex: 1;
      height: 100vh;
      overflow-y: auto;
      padding: 36px 40px;
      background: var(--canvas);
    }

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .page-title {
      font-size: 32px;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.5px;
      color: var(--ink);
    }
    .page-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }

    .btn-refresh {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px;
      border: 1px solid var(--hairline);
      border-radius: var(--r-md);
      background: var(--canvas);
      font-size: 13px; font-weight: 500;
      color: var(--muted);
      cursor: pointer; transition: border-color .12s, color .12s;
      font-family: inherit;
    }
    .btn-refresh:hover  { border-color: var(--ink); color: var(--ink); }
    .btn-refresh svg    { width: 13px; height: 13px; }

    /* ── Stat cards ── */
    .cards-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }
    .cards-row-2 { grid-template-columns: repeat(2, 1fr); }
    .cards-row-3 { grid-template-columns: repeat(3, 1fr); }

    .stat-card {
      background: #FFFFFF;
      border: 1px solid var(--hairline);
      border-radius: var(--r-xl);
      padding: 22px 24px;
      box-shadow: 0 1px 2px rgba(23,23,23,0.06);
    }
    /* Clay brand-color stat card variants */
    .stat-card-peach   { background: var(--peach);   border-color: transparent; }
    .stat-card-teal    { background: var(--teal);    border-color: transparent; color: #fff; }
    .stat-card-pink    { background: var(--pink);    border-color: transparent; color: #fff; }
    .stat-card-lavender{ background: var(--lavender);border-color: transparent; }
    .stat-card-ochre   { background: var(--ochre);   border-color: transparent; }

    .stat-label {
      font-size: 11px; font-weight: 600;
      color: var(--muted); letter-spacing: 1px;
      text-transform: uppercase; margin-bottom: 8px;
    }
    .stat-card-teal .stat-label,
    .stat-card-pink .stat-label  { color: rgba(255,255,255,0.65); }
    .stat-card-peach .stat-label,
    .stat-card-lavender .stat-label,
    .stat-card-ochre .stat-label { color: rgba(10,10,10,0.55); }

    .stat-value {
      font-size: 30px; font-weight: 600;
      letter-spacing: -0.5px; line-height: 1;
      color: var(--ink);
    }
    .stat-card-teal .stat-value,
    .stat-card-pink .stat-value  { color: #fff; }

    .stat-sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .stat-card-teal .stat-sub,
    .stat-card-pink .stat-sub  { color: rgba(255,255,255,0.65); }
    .stat-card-peach .stat-sub,
    .stat-card-lavender .stat-sub,
    .stat-card-ochre .stat-sub { color: rgba(10,10,10,0.5); }

    .stat-value.blue    { color: var(--teal); }
    .stat-value.danger  { color: var(--error); }
    .stat-value.warn    { color: var(--warning); }

    /* ── Section card ── */
    .section-card {
      background: #FFFFFF;
      border: 1px solid var(--hairline);
      border-radius: var(--r-xl);
      padding: 24px 26px;
      margin-bottom: 18px;
      box-shadow: 0 1px 2px rgba(23,23,23,0.06);
    }
    .section-card h3 {
      font-size: 16px; font-weight: 600;
      letter-spacing: -0.1px; margin-bottom: 16px;
      color: var(--ink-strong);
    }


    /* ── Category grid ── */
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
      gap: 10px;
    }
    .cat-card {
      background: var(--surface-soft);
      border: 1px solid var(--hairline);
      border-radius: var(--r-lg);
      padding: 14px 16px;
      cursor: pointer;
      transition: border-color .12s, background .12s;
      position: relative;
    }
    .cat-card:hover { border-color: var(--teal); background: var(--canvas); }
    .cat-card.expanded { border-color: var(--teal); background: var(--canvas); }
    .cat-card-name {
      font-size: 11px; font-weight: 600; color: var(--muted);
      letter-spacing: .8px; text-transform: uppercase; margin-bottom: 5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cat-card-count {
      font-size: 26px; font-weight: 600;
      letter-spacing: -0.5px; line-height: 1; color: var(--ink);
      margin-bottom: 7px;
    }
    .cat-age-bar {
      display: flex; height: 3px; border-radius: 2px; overflow: hidden; gap: 1px;
      margin-bottom: 5px;
    }
    .cat-age-seg { height: 100%; min-width: 2px; border-radius: 1px; }
    .cat-pct { font-size: 10px; color: var(--muted-soft); }
    .cat-yest-badge {
      display: inline-flex; align-items: center;
      margin-top: 6px;
      font-size: 10px; font-weight: 600;
      padding: 2px 7px;
      background: var(--ochre);
      color: var(--ink-strong);
      border-radius: var(--r-pill);
      letter-spacing: .2px;
    }
    .cat-yest-zero {
      display: inline-flex; align-items: center;
      margin-top: 6px;
      font-size: 10px;
      color: var(--muted-soft);
    }
    .cat-str {
      font-size: 11px;
      margin-top: 5px;
    }

    /* ── Dead stock alert ── */
    .dead-stock-list { display: flex; flex-direction: column; gap: 10px; }
    .dead-stock-row {
      display: grid;
      grid-template-columns: 120px 1fr auto auto;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--surface-soft);
      border-radius: var(--r-md);
    }
    .ds-name { font-size: 13px; font-weight: 600; color: var(--ink-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ds-bar-wrap { display: flex; align-items: center; gap: 8px; }
    .ds-bar-bg { flex: 1; height: 6px; background: var(--hairline); border-radius: 3px; overflow: hidden; }
    .ds-bar-fill { height: 100%; border-radius: 3px; transition: width .3s; }
    .ds-pct { font-size: 12px; font-weight: 700; min-width: 36px; text-align: right; }
    .ds-detail { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .ds-badge {
      font-size: 10px; font-weight: 600; padding: 2px 8px;
      border-radius: var(--r-pill); white-space: nowrap;
    }

    /* Category expand panel */
    .cat-expand {
      grid-column: 1 / -1;
      background: var(--canvas);
      border: 1px solid var(--teal);
      border-radius: var(--r-lg);
      padding: 16px 20px;
      display: none;
    }
    .cat-expand.show { display: block; }
    .cat-expand-title { font-size: 13px; font-weight: 600; margin-bottom: 12px; color: var(--ink-strong); }
    .age-breakdown {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    }
    .age-bucket { text-align: center; padding: 10px; border-radius: var(--r-md); }
    .age-bucket .bk-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
    .age-bucket .bk-val { font-size: 20px; font-weight: 600; letter-spacing: -0.5px; }
    .age-bucket-clickable { cursor: pointer; transition: filter .12s; }
    .age-bucket-clickable:hover { filter: brightness(0.93); }
    .age-bucket-clickable.active { box-shadow: 0 0 0 2px var(--teal); }
    .bk-hint { font-size: 10px; margin-top: 3px; opacity: 0.7; }
    .barcode-list-wrap { margin-top: 12px; }
    .barcode-list { display: flex; flex-wrap: wrap; gap: 6px; max-height: 180px; overflow-y: auto; padding: 2px; }
    .barcode-chip {
      font-size: 11px; font-family: 'SF Mono', 'Fira Mono', monospace;
      background: var(--surface-card); border: 1px solid var(--hairline);
      border-radius: var(--r-xs); padding: 3px 8px;
      color: var(--ink-strong); white-space: nowrap;
    }

    /* ── Charts ── */
    .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
    .chart-wrap { position: relative; }

    /* ── Table ── */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; padding: 8px 12px;
      font-size: 10px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .8px;
      border-bottom: 1px solid var(--hairline);
    }
    td { padding: 11px 12px; border-bottom: 1px solid var(--hairline-soft); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface-soft); }

    /* ── Badge ── */
    .badge {
      display: inline-block; padding: 2px 9px;
      border-radius: var(--r-pill); font-size: 11px; font-weight: 600;
    }
    .badge-blue   { background: #dbeafe; color: #1d4ed8; }
    .badge-red    { background: #fee2e2; color: var(--error); }
    .badge-green  { background: #d1fae5; color: #065f46; }
    .badge-gray   { background: var(--surface-card); color: var(--muted); }
    .tag-warehouse {
      display: inline-block; font-size: 11px;
      padding: 1px 7px; background: #ede9fe; color: #5b21b6;
      border-radius: var(--r-pill); margin-left: 6px; vertical-align: middle;
    }

    /* ── Loading ── */
    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,250,240,.88); z-index: 100;
      font-size: 13px; color: var(--muted);
    }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid var(--hairline); border-top-color: var(--teal);
      border-radius: 50%; animation: spin .65s linear infinite; margin-right: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty { text-align: center; padding: 28px; color: var(--muted); font-size: 13px; }

    /* old-count bar */
    .old-bar-bg {
      background: var(--hairline-soft); border-radius: 3px; height: 4px; overflow: hidden;
    }
    .old-bar-fill { height: 100%; border-radius: 3px; background: var(--error); }

    /* ── Mobile header (PC에서는 숨김) ── */
    #mobile-header {
      display: none;
      flex-direction: column;
      background: var(--tile);
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .mob-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .mob-hub-back {
      color: var(--peach);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .mob-header-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--on-dark);
    }
    .mob-refresh-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
    }
    .mob-refresh-btn svg { width: 16px; height: 16px; }
    #mobile-tab-bar {
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    #mobile-tab-bar::-webkit-scrollbar { display: none; }
    .mob-tab {
      flex-shrink: 0;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .mob-tab.active {
      color: var(--peach);
      border-bottom-color: var(--peach);
      font-weight: 600;
    }

    /* ── 모바일 반응형 ── */
    @media (max-width: 767px) {
      body {
        flex-direction: column;
        height: auto;
        min-height: 100dvh;
        overflow-y: auto;
      }
      #sidebar { display: none; }
      #mobile-header { display: flex; }
      #main {
        height: auto;
        overflow-y: visible;
        padding: 14px;
      }
      .page-title { font-size: 20px; }
      .page-header { margin-bottom: 14px; }

      /* stat 카드: 2열 */
      .cards-row,
      .cards-row-2,
      .cards-row-3 { grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
      .stat-card { padding: 14px 12px; border-radius: var(--r-lg); }
      .stat-value { font-size: 22px; }
      .stat-sub { font-size: 11px; }

      /* 차트: 세로 스택 */
      .charts-row { grid-template-columns: 1fr; gap: 12px; margin-bottom: 12px; }

      /* section 카드 */
      .section-card { padding: 14px 14px; margin-bottom: 12px; border-radius: var(--r-lg); }
      .section-card h3 { font-size: 14px; margin-bottom: 12px; }

      /* 장기재고 row: 이름+뱃지 / 바 */
      .dead-stock-row {
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto;
        gap: 8px 10px;
        padding: 10px 10px;
      }
      .dead-stock-row .ds-name    { grid-column: 1; grid-row: 1; font-size: 12px; }
      .dead-stock-row .ds-badge   { grid-column: 2; grid-row: 1; align-self: center; }
      .dead-stock-row .ds-bar-wrap{ grid-column: 1 / -1; grid-row: 2; }
      .dead-stock-row .ds-detail  { display: none; }

      /* 카테고리 연령 분포: 2열 */
      .age-breakdown { grid-template-columns: 1fr 1fr; gap: 8px; }
      .age-bucket .bk-val { font-size: 18px; }

      /* 테이블 */
      table { font-size: 11px; }
      th, td { padding: 7px 8px; }

      /* 새로고침 버튼 */
      .btn-refresh { font-size: 12px; padding: 6px 10px; }
    }
  </style>
</head>
<body>

<div id="mobile-header">
  <div class="mob-header-top">
    <a href="../" class="mob-hub-back">← 허브로</a>
    <span class="mob-header-title">매장 현황판</span>
    <button class="mob-refresh-btn" onclick="route()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
  </div>
  <div id="mobile-tab-bar"></div>
</div>

<aside id="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-mark"></div>
    매장 현황판
  </div>
  <a href="../" style="display:flex;align-items:center;gap:6px;padding:10px 16px;color:var(--peach);font-size:12px;font-weight:600;text-decoration:none;border-bottom:1px solid rgba(255,255,255,0.08);margin-bottom:8px;-webkit-tap-highlight-color:transparent;">← 허브로</a>
  <div id="nav"></div>
  <div class="sidebar-footer" id="footer-time">로딩 중...</div>
</aside>

<main id="main">
  <div id="content"></div>
</main>

<div id="loading"><div class="spinner"></div>데이터 불러오는 중...</div>

<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
</body>
</html>
