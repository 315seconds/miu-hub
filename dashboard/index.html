<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>매장 현황판 — 마켓인유</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="/miu-hub/shared/tokens.css?v=202611170050">
  <link rel="stylesheet" href="/miu-hub/shared/layout.css?v=202611170050">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* 옛 이름은 shared/tokens.css 의 --miu-* 로 연결한다 (색·반경의 단일 출처는 토큰) */
      --canvas:       var(--miu-canvas);
      --surface-soft: var(--miu-surface-soft);
      --surface-card: var(--miu-surface-card);
      --surface-strong: var(--miu-surface-strong);

      /* 데스크톱 사이드바 (다크) */
      --tile:         var(--miu-surface-dark);
      --tile-elevated:var(--miu-surface-dark-elevated);
      --on-dark:      var(--miu-on-dark);
      --muted-dk:     rgba(250,249,245,0.6);

      --ink:          var(--miu-ink);
      --ink-strong:   var(--miu-ink);
      --body:         var(--miu-body);
      --muted:        var(--miu-muted);
      --muted-soft:   var(--miu-muted-soft);
      --hairline:     var(--miu-hairline);
      --hairline-soft:var(--miu-hairline-soft);

      /* 장식(다크 사이드바 위 점·로고)용 코랄 */
      --peach:        var(--miu-primary-soft);

      --success:      var(--miu-success);
      --warning:      var(--miu-warning);
      --error:        var(--miu-error);

      --r-xs:   var(--miu-r-xs);
      --r-sm:   var(--miu-r-sm);
      --r-md:   var(--miu-r-md);
      --r-lg:   var(--miu-r-lg);
      --r-xl:   var(--miu-r-xl);
      --r-pill: var(--miu-r-pill);
    }

    body {
      font-family: 'Pretendard Variable', 'Pretendard', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--canvas);
      color: var(--ink);
      display: flex;
      height: 100vh;
      overflow: hidden;
      font-size: 16px;
      line-height: 1.55;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 220px;
      min-width: 220px;
      background: var(--tile);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-logo {
      padding: 20px 18px 16px;
      font-size: 14px;
      font-weight: 600;
      color: var(--on-dark);
      letter-spacing: -0.1px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .sidebar-logo-mark {
      width: 24px; height: 24px;
      background: var(--peach);
      border-radius: 6px;
      flex-shrink: 0;
    }

    .sidebar-section {
      padding: 12px 10px 4px;
    }
    .sidebar-section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.2px;
      color: var(--muted-dk);
      text-transform: uppercase;
      padding: 0 8px;
      margin-bottom: 3px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: var(--r-sm);
      font-size: 13px;
      font-weight: 400;
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      cursor: pointer;
      transition: background .12s, color .12s;
      margin-bottom: 1px;
    }
    .nav-item:hover  { background: rgba(255,255,255,0.06); color: var(--on-dark); }
    .nav-item.active { background: rgba(255,255,255,0.11); color: var(--on-dark); font-weight: 500; }
    .nav-item svg    { width: 13px; height: 13px; flex-shrink: 0; opacity: .65; }
    .nav-item.active svg { opacity: 1; }
    .nav-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.2); flex-shrink: 0; }
    .nav-item.active .nav-dot { background: var(--peach); }

    .sidebar-footer {
      margin-top: auto;
      padding: 14px 18px;
      font-size: 11px;
      color: var(--muted-dk);
      border-top: 1px solid rgba(255,255,255,0.07);
      line-height: 1.6;
      white-space: pre-line;
    }

    /* ── Main ── */
    #main {
      flex: 1;
      height: 100vh;
      overflow-y: auto;
      padding: 36px 40px;
      background: var(--canvas);
    }

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .page-title {
      font-size: 32px;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.5px;
      color: var(--ink);
    }
    .page-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }

    .btn-refresh {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px;
      border: 1px solid var(--hairline);
      border-radius: var(--r-md);
      background: var(--canvas);
      font-size: 13px; font-weight: 500;
      color: var(--muted);
      cursor: pointer; transition: border-color .12s, color .12s;
      font-family: inherit;
    }
    .btn-refresh:hover  { border-color: var(--ink); color: var(--ink); }
    .btn-refresh svg    { width: 13px; height: 13px; }

    /* ── Stat cards ── */
    .cards-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }
    .cards-row-2 { grid-template-columns: repeat(2, 1fr); }
    .cards-row-3 { grid-template-columns: repeat(3, 1fr); }

    /* 요약 카드는 공용 .miu-stat. 위치 상세의 카드 줄 */
    .cards-row .miu-stat { min-width: 0; }

    /* ── Section card ── */
    .section-card {
      background: var(--miu-canvas);
      border: 1px solid var(--miu-hairline);
      border-radius: var(--miu-r-lg);
      padding: 18px 20px;
      margin-bottom: 18px;
    }
    .section-card h3 {
      font-size: 16px; font-weight: 600;
      letter-spacing: -0.1px; margin-bottom: 16px;
      color: var(--miu-ink);
    }
    .section-card h3 .h3-sub { font-size: 13px; font-weight: 400; color: var(--miu-muted); }
    .section-card.ok  { border-color: var(--miu-success); }
    .section-card.bad { border-color: var(--miu-error); }


    /* ── Category grid ── */
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
      gap: 10px;
    }
    .cat-card {
      background: var(--surface-soft);
      border: 1px solid var(--hairline);
      border-radius: var(--r-lg);
      padding: 14px 16px;
      cursor: pointer;
      transition: border-color .12s, background .12s;
      position: relative;
    }
    .cat-card:hover { border-color: var(--miu-primary); background: var(--canvas); }
    .cat-card.expanded { border-color: var(--miu-primary); background: var(--canvas); }
    .cat-card-name {
      font-size: 12px; font-weight: 600; color: var(--muted);
      letter-spacing: .4px; text-transform: uppercase; margin-bottom: 5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cat-card-count {
      font-size: 26px; font-weight: 600;
      letter-spacing: -0.5px; line-height: 1; color: var(--ink);
      margin-bottom: 7px; font-variant-numeric: tabular-nums;
    }
    .cat-age-bar {
      display: flex; height: 4px; border-radius: 2px; overflow: hidden; gap: 1px;
      margin-bottom: 6px;
    }
    .cat-age-seg { height: 100%; min-width: 2px; border-radius: 1px; }
    .cat-yest-badge {
      display: inline-flex; align-items: center;
      margin-top: 6px;
      font-size: 12px; font-weight: 600;
      padding: 2px 8px;
      background: color-mix(in srgb, var(--miu-primary) 12%, var(--canvas));
      color: var(--miu-primary);
      border-radius: var(--r-pill);
    }
    .cat-yest-zero {
      display: inline-flex; align-items: center;
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
    }
    .cat-str {
      font-size: 13px;
      margin-top: 5px;
    }

    /* ── Dead stock alert ── */
    .dead-stock-list { display: flex; flex-direction: column; gap: 10px; }
    .dead-stock-row {
      display: grid;
      grid-template-columns: 120px 1fr auto auto;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--surface-soft);
      border-radius: var(--r-md);
    }
    .ds-name { font-size: 14px; font-weight: 600; color: var(--ink-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ds-bar-wrap { display: flex; align-items: center; gap: 8px; }
    .ds-bar-bg { flex: 1; height: 6px; background: var(--hairline); border-radius: 3px; overflow: hidden; }
    .ds-bar-fill { height: 100%; border-radius: 3px; transition: width .3s; }
    .ds-pct { font-size: 13px; font-weight: 700; min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
    .ds-detail { font-size: 13px; color: var(--muted); white-space: nowrap; }
    .ds-badge { white-space: nowrap; }

    /* Category expand panel */
    .cat-expand {
      grid-column: 1 / -1;
      background: var(--canvas);
      border: 1px solid var(--miu-primary);
      border-radius: var(--r-lg);
      padding: 16px 20px;
      display: none;
    }
    .cat-expand.show { display: block; }
    .cat-expand-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--ink-strong); gap: 10px; }
    .age-breakdown {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    }
    .age-bucket { text-align: center; padding: 10px; border-radius: var(--r-md); }
    .age-bucket .bk-label { font-size: 13px; color: var(--ink); margin-bottom: 4px; font-weight: 500; }
    .age-bucket .bk-val { font-size: 20px; font-weight: 600; letter-spacing: -0.5px; color: var(--ink); font-variant-numeric: tabular-nums; }
    .age-bucket-clickable { cursor: pointer; transition: filter .12s; }
    .age-bucket-clickable:hover { filter: brightness(0.93); }
    .age-bucket-clickable.active { box-shadow: 0 0 0 2px var(--miu-primary); }
    .bk-hint { font-size: 12px; margin-top: 3px; color: var(--muted); }
    .barcode-list-wrap { margin-top: 12px; }
    .barcode-list { display: flex; flex-wrap: wrap; gap: 6px; max-height: 180px; overflow-y: auto; padding: 2px; }
    .barcode-chip {
      font-size: 13px; font-family: var(--miu-mono);
      background: var(--surface-card); border: 1px solid var(--hairline);
      border-radius: var(--r-xs); padding: 3px 8px;
      color: var(--ink-strong); white-space: nowrap;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .chip-badge {
      font-family: var(--miu-sans); font-size: 12px; font-weight: 500;
      color: var(--miu-warning-text);
      background: color-mix(in srgb, var(--miu-warning) 22%, transparent);
      border-radius: 999px;
      padding: 1px 6px; white-space: nowrap;
    }
    .barcode-chip-urgent { border-color: var(--miu-error); background: color-mix(in srgb, var(--miu-error) 12%, var(--canvas)); }
    .barcode-chip-urgent .chip-badge { color: var(--miu-error-text); background: color-mix(in srgb, var(--miu-error) 16%, transparent); }

    /* ── Charts ── */
    .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
    .chart-wrap { position: relative; }

    /* ── Table ── */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; padding: 8px 12px;
      font-size: 12px; font-weight: 600; color: var(--muted);
      letter-spacing: .3px; white-space: nowrap;
      border-bottom: 1px solid var(--hairline);
    }
    td { padding: 11px 12px; border-bottom: 1px solid var(--hairline-soft); font-variant-numeric: tabular-nums; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface-soft); }

    /* ── Badge ── */
    .badge {
      display: inline-block; padding: 2px 9px;
      border-radius: var(--r-pill); font-size: 12px; font-weight: 600;
    }
    .badge-red    { background: color-mix(in srgb, var(--miu-error) 14%, transparent); color: var(--miu-error-text); }
    .badge-gray   { background: var(--surface-card); color: var(--muted); }
    .tag-warehouse {
      display: inline-block; font-size: 12px; white-space: nowrap;
      padding: 1px 7px; background: var(--surface-card); color: var(--muted);
      border-radius: var(--r-pill); margin-left: 6px; vertical-align: middle;
    }

    /* ── Loading ── */
    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: color-mix(in srgb, var(--miu-canvas) 88%, transparent); z-index: 100;
      font-size: 14px; color: var(--muted);
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--hairline); border-top-color: var(--miu-primary);
      border-radius: 50%; animation: spin .65s linear infinite; margin-right: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty { text-align: center; padding: 28px; color: var(--muted); font-size: 14px; }

    /* old-count bar */
    .old-bar-bg {
      background: var(--hairline-soft); border-radius: 3px; height: 4px; overflow: hidden;
    }
    .old-bar-fill { height: 100%; border-radius: 3px; background: var(--error); }

    /* ── Mobile header (PC에서는 숨김) ── */
    #mobile-header {
      display: none;
      flex-direction: column;
      background: var(--miu-canvas);
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--miu-hairline);
    }
    #mobile-tab-bar {
      background: var(--miu-canvas);
      padding: 0 4px;
    }
    .mob-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .mob-hub-back {
      color: var(--peach);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .mob-header-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--on-dark);
    }
    .mob-refresh-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
    }
    .mob-refresh-btn svg { width: 16px; height: 16px; }
    a.mob-tab { display: flex; align-items: center; text-decoration: none; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
    .chart-legend { display: flex; gap: 16px; margin-bottom: 8px; font-size: 13px; color: var(--miu-muted); }
    .chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .lg-dot { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
    .lg-dot.primary { background: #9f5238; }
    .lg-dot.neutral { background: #b9b3a6; }

    /* ── Dashboard section (receiving 스타일) ── */
    .dash-section { margin-bottom: 28px; }
    .dash-section .miu-section-head { margin-bottom: 14px; }
    .dash-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .dash-stat-sub {
      font-size: 13px;
      color: var(--miu-muted);
      margin-top: 6px;
      line-height: 1.4;
    }
    .dash-panel {
      background: var(--miu-canvas);
      border: 1px solid var(--miu-hairline);
      border-radius: var(--miu-r-lg);
      padding: 16px;
    }
    @media (min-width: 640px) {
      .dash-stats { grid-template-columns: repeat(4, 1fr); }
    }

    /* ── Closure button ── */
    .btn-closure {
      display: flex; align-items: center; gap: 6px;
      min-height: var(--miu-tap);
      padding: 0 16px;
      border: 1px solid color-mix(in srgb, var(--miu-error) 45%, transparent);
      border-radius: var(--r-md);
      background: var(--miu-canvas);
      font-size: 14px; font-weight: 600;
      color: var(--miu-error);
      cursor: pointer; transition: background .12s, color .12s;
      font-family: inherit;
    }
    .btn-closure:hover { background: var(--error); color: #fff; }

    .btn-csv-dl {
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--miu-hairline);
      border-radius: var(--r-md);
      background: var(--miu-canvas);
      font-size: 13px; font-weight: 600;
      color: var(--miu-body);
      cursor: pointer; transition: background .12s, color .12s, border-color .12s;
      font-family: inherit;
    }
    .btn-csv-dl:hover { border-color: var(--miu-primary); color: var(--miu-primary); background: var(--miu-surface-soft); }

    .closed-select-all-label {
      display: flex; align-items: center; gap: 8px;
      min-height: var(--miu-tap);
      font-size: 14px; color: var(--muted); cursor: pointer;
      user-select: none;
    }
    .closed-select-all-label input, .closed-store-header input[type=checkbox] {
      width: 22px; height: 22px; accent-color: var(--miu-primary);
    }

    /* ── PIN Modal ── */
    .pin-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 200;
    }
    .pin-modal {
      background: var(--miu-canvas);
      border-radius: var(--r-xl);
      padding: 32px 28px 24px;
      width: 300px;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,0.22);
    }
    .pin-title { font-size: 17px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
    .pin-subtitle { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
    .pin-dots { display: flex; justify-content: center; gap: 14px; margin-bottom: 6px; }
    .pin-dot {
      width: 13px; height: 13px; border-radius: 50%;
      border: 2px solid var(--hairline); background: transparent;
      transition: background .1s, border-color .1s;
    }
    .pin-dot.filled { background: var(--ink); border-color: var(--ink); }
    .pin-error { font-size: 13px; color: var(--miu-error-text); height: 20px; margin-bottom: 14px; }
    .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .pin-key {
      padding: 15px;
      border: 1px solid var(--hairline);
      border-radius: var(--r-md);
      background: var(--surface-soft);
      font-size: 18px; font-weight: 500; color: var(--ink);
      cursor: pointer; font-family: inherit;
      transition: background .1s;
    }
    .pin-key:hover  { background: var(--surface-card); }
    .pin-key:active { background: var(--surface-strong); }
    .pin-key-empty  { border: none !important; background: transparent !important; cursor: default; }
    .pin-key-del    { font-size: 15px; }
    .pin-cancel {
      width: 100%; min-height: var(--miu-tap); padding: 0 10px;
      border: 1px solid var(--hairline); border-radius: var(--r-md);
      background: transparent; font-size: 14px; color: var(--muted);
      cursor: pointer; font-family: inherit;
    }
    .pin-cancel:hover { border-color: var(--ink); color: var(--ink); }

    /* ── Closed location items page ── */
    .closed-store-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .closed-store-title { font-size: 15px; font-weight: 600; color: var(--ink-strong); }
    .closed-store-count { font-size: 13px; color: var(--muted); }
    .barcode-chip-list  { display: flex; flex-wrap: wrap; gap: 6px; }

    /* 헤더 액션 줄 (위험 동작은 다른 버튼과 16px 이상 띄운다) */
    .page-actions { display: flex; gap: 8px 16px; align-items: center; flex-wrap: wrap; }
    .btn-refresh { min-height: var(--miu-tap); }

    /* ── 모바일 반응형 ── */
    @media (max-width: 767px) {
      body {
        flex-direction: column;
        height: auto;
        min-height: 100dvh;
        overflow-y: auto;
      }
      #sidebar { display: none; }
      #mobile-header { display: flex; }
      #main {
        height: auto;
        overflow-y: visible;
        padding: 14px;
      }
      .page-title { font-size: 20px; }
      .page-header { flex-direction: column; gap: 12px; margin-bottom: 14px; }

      /* 새로고침은 모바일 헤더에 있으니 본문 쪽 중복 버튼은 숨김 */
      .dash-refresh-desk, .refresh-dup { display: none; }

      /* stat 카드: 2열 */
      .cards-row,
      .cards-row-2,
      .cards-row-3 { grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
